# Cloudflare Pages configuration
name = "ipl-2026-website"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "SPORTS_KV"
id = "local-sports-kv"
preview_id = "local-sports-kv-preview"

[[kv_namespaces]]
binding = "IPL_CACHE"
id = "local-ipl-cache"
preview_id = "local-ipl-cache-preview"

[[kv_namespaces]]
binding = "WEATHER_CACHE"
id = "local-weather-cache"
preview_id = "local-weather-cache-preview"

# Environment configuration
# Admin route protection is enforced in functions/_middleware.ts with Google OAuth.
#
# Non-secret vars only (safe to commit):
[env.production]
vars = {
  ENVIRONMENT = "production",
  ADMIN_ALLOWED_EMAILS = "anveshkoganti54@gmail.com",
  ADMIN_PLAYERS_ADMIN_EMAILS = "sumanthvallam20@gmail.com"
}

[env.development]
vars = {
  ENVIRONMENT = "development",
  ADMIN_ALLOWED_EMAILS = "anveshkoganti54@gmail.com",
  ADMIN_PLAYERS_ADMIN_EMAILS = "sumanthvallam20@gmail.com"
}

# Encrypted secrets (never commit values). Set in Cloudflare Dashboard or CLI:
#   npx wrangler pages secret put OPENWEATHER_API_KEY --project-name=ipl-2026-website
#   npx wrangler pages secret put GOOGLE_CLIENT_ID --project-name=ipl-2026-website
#   npx wrangler pages secret put GOOGLE_CLIENT_SECRET --project-name=ipl-2026-website
#   npx wrangler pages secret put ADMIN_SESSION_SECRET --project-name=ipl-2026-website
# Local wrangler dev: copy .dev.vars.example to .dev.vars (gitignored)

# Scheduled event for email reminders
# This cron job runs every 5 minutes to check for matches starting in 30 minutes
[[triggers.crons]]
cron = "*/5 * * * *"  # Run every 5 minutes
path = "/api/admin/match-reminders"

# Scheduled event for weather updates
# This cron job runs twice daily at 6 AM and 6 PM UTC to update weather for WPL stadiums
[[triggers.crons]]
cron = "0 6 * * *"  # Run daily at 6 AM UTC
path = "/cron/weather-update"

[[triggers.crons]]
cron = "0 18 * * *"  # Run daily at 6 PM UTC
path = "/cron/weather-update"

# Email service environment variables
# Uncomment and set your email service credentials:
# RESEND_API_KEY = "your-resend-api-key"
# OR
# SENDGRID_API_KEY = "your-sendgrid-api-key"
# OR
# MAILGUN_API_KEY = "your-mailgun-api-key"
# MAILGUN_DOMAIN = "your-mailgun-domain"
