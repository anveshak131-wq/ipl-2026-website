# Cloudflare Pages configuration
name = "ipl-2026-website"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "SPORTS_KV"
id = "local-sports-kv"
preview_id = "local-sports-kv-preview"

[[kv_namespaces]]
binding = "IPL_CACHE"
id = "local-ipl-cache"
preview_id = "local-ipl-cache-preview"

[[kv_namespaces]]
binding = "WEATHER_CACHE"
id = "local-weather-cache"
preview_id = "local-weather-cache-preview"

# Environment configuration for email service
[env.production]
vars = { 
  ENVIRONMENT = "production",
  OPENWEATHER_API_KEY = "4521f1357955496894b160548251012"
}

# Development environment variables
[env.development]
vars = { 
  ENVIRONMENT = "development",
  OPENWEATHER_API_KEY = "4521f1357955496894b160548251012"
}

# Scheduled event for email reminders
# This cron job runs every 5 minutes to check for matches starting in 30 minutes
[[triggers.crons]]
cron = "*/5 * * * *"  # Run every 5 minutes
path = "/api/admin/match-reminders"

# Scheduled event for weather updates
# This cron job runs twice daily at 6 AM and 6 PM UTC to update weather for WPL stadiums
[[triggers.crons]]
cron = "0 6 * * *"  # Run daily at 6 AM UTC
path = "/cron/weather-update"

[[triggers.crons]]
cron = "0 18 * * *"  # Run daily at 6 PM UTC
path = "/cron/weather-update"

# Email service environment variables
# Uncomment and set your email service credentials:
# RESEND_API_KEY = "your-resend-api-key"
# OR
# SENDGRID_API_KEY = "your-sendgrid-api-key"
# OR
# MAILGUN_API_KEY = "your-mailgun-api-key"
# MAILGUN_DOMAIN = "your-mailgun-domain"
