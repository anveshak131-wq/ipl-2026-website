<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes rrPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes pinkBlueGlow {
        0%, 100% { filter: drop-shadow(0 0 15px #EA1A85); }
        50% { filter: drop-shadow(0 0 30px #EA1A85) drop-shadow(0 0 35px #004B8D); }
      }
      @keyframes crownRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes royalShine {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }
      .rr-bg { animation: rrPulse 2.5s ease-in-out infinite; }
      .rr-glow { animation: pinkBlueGlow 2s ease-in-out infinite; }
      .crown-rotate { animation: crownRotate 20s linear infinite; transform-origin: 100px 100px; }
      .royal { animation: royalShine 2s ease-in-out infinite; }
    </style>
    <linearGradient id="rrGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EA1A85;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2185B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="40" fill="url(#rrGradient)" class="rr-bg rr-glow"/>
  
  <circle cx="100" cy="100" r="50" fill="#004B8D" opacity="0.3" class="crown-rotate"/>
  <path d="M 60 120 L 50 90 L 70 100 L 80 80 L 90 100 L 100 70 L 110 100 L 120 80 L 130 100 L 150 90 L 140 120 Z" fill="#FFD700" class="royal"/>
  
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#fff">RR</text>
</svg>

