<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes rcbPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.05); }
      }
      @keyframes rcbGlow {
        0%, 100% { filter: drop-shadow(0 0 10px #EC1C24); }
        50% { filter: drop-shadow(0 0 25px #EC1C24) drop-shadow(0 0 35px #FF6B6B); }
      }
      @keyframes rcbGradient {
        0% { stop-color: #EC1C24; }
        50% { stop-color: #FF4757; }
        100% { stop-color: #EC1C24; }
      }
      @keyframes crownShine {
        0% { opacity: 0.8; }
        50% { opacity: 1; }
        100% { opacity: 0.8; }
      }
      .rcb-bg { animation: rcbPulse 3s ease-in-out infinite; }
      .rcb-glow { animation: rcbGlow 2s ease-in-out infinite; }
      .rcb-gradient-stop { animation: rcbGradient 3s ease-in-out infinite; }
      .crown { animation: crownShine 2s ease-in-out infinite; }
    </style>
    <linearGradient id="rcbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="rcb-gradient-stop" style="stop-color:#EC1C24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#990000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#660000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="40" fill="url(#rcbGradient)" class="rcb-bg rcb-glow"/>
  
  <path d="M 60 140 L 40 100 L 60 100 L 70 80 L 80 100 L 100 100 L 120 80 L 130 100 L 150 100 L 140 140 Z" fill="#FFD700" stroke="#fff" stroke-width="3" class="crown"/>
  
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#fff">RCB</text>
</svg>

