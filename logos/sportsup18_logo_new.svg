<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-labelledby="title desc">
  <title id="title">SportsUP18 Logo</title>
  <desc id="desc">SportsUP18 wordmark in a modern rounded badge.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.133  0 0 0 0 0.925  0 0 0 0 0.451  0 0 0 0.6 0" />
    </filter>
  </defs>

  <!-- Background badge -->
  <rect x="4" y="6" width="312" height="68" rx="18" fill="url(#bgGrad)" />
  <rect x="4" y="6" width="312" height="68" rx="18" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.55" />

  <!-- Subtle glow under the text -->
  <ellipse cx="152" cy="52" rx="120" ry="18" fill="#22c55e" opacity="0.18" filter="url(#glow)" />

  <!-- Cricket ball accent on the left -->
  <g transform="translate(36,40)">
    <circle r="18" fill="#f97316" />
    <circle r="18" fill="none" stroke="#fed7aa" stroke-width="1.3" opacity="0.65" />
    <path d="M -16 -4 C -6 -8 6 -8 16 -4" fill="none" stroke="#fee2e2" stroke-width="2" stroke-linecap="round" />
    <path d="M -16 0 C -6 -4 6 -4 16 0" fill="none" stroke="#fecaca" stroke-width="1.3" stroke-linecap="round" opacity="0.85" />
    <path d="M -16 4 C -6 0 6 0 16 4" fill="none" stroke="#fed7aa" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Text: SportsUP -->
  <text x="82" y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="1" fill="#e5e7eb">
    Sports
  </text>
  <text x="162" y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="url(#accentGrad)">
    UP
  </text>

  <!-- Number 18 tag -->
  <g transform="translate(238,27)">
    <rect x="-4" y="-10" width="52" height="30" rx="10" fill="rgba(15,23,42,0.9)" stroke="#38bdf8" stroke-width="1.4" />
    <text x="22" y="11" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#f9fafb">
      18
    </text>
  </g>

  <!-- Small subtitle -->
  <text x="82" y="60" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="11" letter-spacing="0.12em" fill="#9ca3af" textLength="190">
    IPL 2026 EXPERIENCE PLATFORM
  </text>
</svg>
