<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes kkrPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @keyframes purpleGlow {
        0%, 100% { filter: drop-shadow(0 0 15px #3A225D); }
        50% { filter: drop-shadow(0 0 30px #3A225D) drop-shadow(0 0 40px #6B46C1); }
      }
      @keyframes goldShine {
        0% { opacity: 0.8; transform: rotate(0deg); }
        50% { opacity: 1; transform: rotate(180deg); }
        100% { opacity: 0.8; transform: rotate(360deg); }
      }
      @keyframes knightMove {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(5px); }
      }
      .kkr-bg { animation: kkrPulse 3s ease-in-out infinite; }
      .kkr-glow { animation: purpleGlow 2.5s ease-in-out infinite; }
      .gold-element { animation: goldShine 4s linear infinite; }
      .knight { animation: knightMove 2s ease-in-out infinite; }
    </style>
    <linearGradient id="kkrGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3A225D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="40" fill="url(#kkrGradient)" class="kkr-bg kkr-glow"/>
  
  <circle cx="100" cy="100" r="50" fill="#B9975B" opacity="0.3"/>
  <path d="M 100 70 L 110 90 L 130 90 L 115 105 L 120 125 L 100 115 L 80 125 L 85 105 L 70 90 L 90 90 Z" fill="#B9975B" class="gold-element"/>
  <rect x="90" y="120" width="20" height="30" rx="5" fill="#B9975B" class="knight"/>
  
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#fff">KKR</text>
</svg>

