<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Duplicate Teams</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        h1 { color: #333; margin-bottom: 20px; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover { transform: translateY(-2px); transition: transform 0.2s; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 300px;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Fix Duplicate Teams</h1>
        
        <div class="warning">
            <strong>⚠️ This tool will:</strong>
            <ul>
                <li>Check for duplicate team entries in your database</li>
                <li>Remove duplicates, keeping only one entry per team ID</li>
                <li>Fix your dropdown filters</li>
            </ul>
        </div>

        <div style="margin: 20px 0;">
            <input 
                type="text" 
                id="adminToken" 
                placeholder="Paste admin token (from localStorage.getItem('adminToken'))"
                style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;"
            />
        </div>

        <div style="margin: 20px 0;">
            <button onclick="checkDuplicates()">1. Check for Duplicates</button>
            <button onclick="fixDuplicates()">2. Fix Duplicates</button>
            <button onclick="verifyFix()">3. Verify Fix</button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        async function checkDuplicates() {
            const resultDiv = document.getElementById('result');
            
            resultDiv.className = 'result info';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<strong>Checking for duplicates...</strong>';

            try {
                const response = await fetch('https://ipl-2026-website.pages.dev/api/teams?league=wpl');
                const teams = await response.json();

                // Count occurrences by ID
                const idCounts = {};
                teams.forEach(team => {
                    idCounts[team.id] = (idCounts[team.id] || 0) + 1;
                });

                const duplicates = Object.entries(idCounts).filter(([id, count]) => count > 1);
                
                let html = `<strong>Found ${teams.length} WPL teams total</strong><br><br>`;
                
                if (duplicates.length > 0) {
                    html += `<strong style="color: #dc2626;">⚠️ ${duplicates.length} team(s) with duplicates:</strong><br>`;
                    duplicates.forEach(([id, count]) => {
                        const teamName = teams.find(t => t.id === id)?.name || 'Unknown';
                        html += `- ${teamName} (ID: ${id}): ${count} entries<br>`;
                    });
                } else {
                    html += '<strong style="color: #22c55e;">✅ No duplicates found!</strong>';
                }

                html += '<br><br><details><summary>View all teams</summary><pre>' + 
                        JSON.stringify(teams.map(t => ({ id: t.id, name: t.name })), null, 2) + 
                        '</pre></details>';

                resultDiv.className = duplicates.length > 0 ? 'result error' : 'result success';
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ Error:</strong> ${error.message}`;
            }
        }

        async function fixDuplicates() {
            const token = document.getElementById('adminToken').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!token) {
                resultDiv.className = 'result error';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '<strong>Error:</strong> Please enter admin token';
                return;
            }

            if (!confirm('This will remove duplicate team entries. Continue?')) {
                return;
            }

            resultDiv.className = 'result info';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<strong>Fixing duplicates...</strong>';

            try {
                // Get all teams
                const response = await fetch('https://ipl-2026-website.pages.dev/api/teams');
                const teams = await response.json();

                // Deduplicate by ID - keep first occurrence
                const uniqueTeams = [];
                const seenIds = new Set();
                
                teams.forEach(team => {
                    if (!seenIds.has(team.id)) {
                        seenIds.add(team.id);
                        uniqueTeams.push(team);
                    }
                });

                const removedCount = teams.length - uniqueTeams.length;

                // Update each team (this will trigger a full rewrite with deduplication)
                // We'll use a simple trick: update one team to force KV rewrite
                if (removedCount > 0) {
                    const firstTeam = uniqueTeams[0];
                    const updateResponse = await fetch('https://ipl-2026-website.pages.dev/api/teams', {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            id: firstTeam.id,
                            ...firstTeam,
                            _forceRefresh: true
                        })
                    });

                    if (updateResponse.ok) {
                        resultDiv.className = 'result success';
                        resultDiv.innerHTML = `
                            <strong>✅ Success!</strong><br><br>
                            <p>Removed ${removedCount} duplicate team entries</p>
                            <p>Unique teams: ${uniqueTeams.length}</p>
                            <p>Wait 10 seconds for cache propagation, then verify the fix.</p>
                        `;
                    } else {
                        throw new Error('Failed to update teams');
                    }
                } else {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = '<strong>✅ No duplicates found to fix!</strong>';
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ Error:</strong> ${error.message}`;
            }
        }

        async function verifyFix() {
            const resultDiv = document.getElementById('result');
            
            resultDiv.className = 'result info';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<strong>Verifying fix...</strong>';

            try {
                const response = await fetch('https://ipl-2026-website.pages.dev/api/teams?league=wpl&t=' + Date.now());
                const teams = await response.json();

                // Count occurrences by ID
                const idCounts = {};
                teams.forEach(team => {
                    idCounts[team.id] = (idCounts[team.id] || 0) + 1;
                });

                const duplicates = Object.entries(idCounts).filter(([id, count]) => count > 1);
                
                if (duplicates.length === 0) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ All checks passed!</strong><br><br>
                        <p>Total WPL teams: ${teams.length}</p>
                        <p>No duplicate entries found</p>
                        <p style="color: #22c55e;">Your dropdowns should now show each team only once! ✨</p>
                        <br>
                        <p><em>If you still see duplicates, try clearing your browser cache (Ctrl/Cmd + Shift + R)</em></p>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>❌ Still found duplicates:</strong><br>
                        ${duplicates.map(([id, count]) => {
                            const teamName = teams.find(t => t.id === id)?.name || 'Unknown';
                            return `- ${teamName}: ${count} entries`;
                        }).join('<br>')}
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ Error:</strong> ${error.message}`;
            }
        }

        // Auto-load token
        window.addEventListener('load', () => {
            const savedToken = localStorage.getItem('adminToken');
            if (savedToken) {
                document.getElementById('adminToken').value = savedToken;
            }
        });
    </script>
</body>
</html>
