<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg_dhoni" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081024"/>
      <stop offset="55%" stop-color="#0E1E38"/>
      <stop offset="100%" stop-color="#070D1C"/>
    </linearGradient>
    <radialGradient id="glow_dhoni" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 280) rotate(135) scale(480)">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="csk_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="csk_blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg_dhoni)"/>
  <rect width="1200" height="675" fill="url(#glow_dhoni)"/>

  <!-- Subtle Tactical Pitch Grid -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Right Visual: Iconic #7 & Trophy Stars -->
  <g transform="translate(860 330)">
    <!-- Aura Rings -->
    <circle cx="0" cy="0" r="170" stroke="url(#csk_gold)" stroke-width="2" stroke-dasharray="10 8" opacity="0.3"/>
    <circle cx="0" cy="0" r="130" fill="#0C1B36" stroke="url(#csk_blue)" stroke-width="3" opacity="0.9"/>
    
    <!-- Bold Number 7 -->
    <text x="0" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="120" font-weight="900" fill="url(#csk_gold)" letter-spacing="-4">
      7
    </text>

    <!-- 5 Championship Stars (2010, 2011, 2018, 2021, 2023) -->
    <g transform="translate(-100 -120)">
      <polygon points="20,0 25,14 40,14 28,23 32,37 20,28 8,37 12,23 0,14 15,14" fill="#FACC15"/>
      <polygon points="60,0 65,14 80,14 68,23 72,37 60,28 48,37 52,23 40,14 55,14" fill="#FACC15"/>
      <polygon points="100,-15 105,-1 120,-1 108,8 112,22 100,13 88,22 92,8 80,-1 95,-1" fill="#FDE047"/>
      <polygon points="140,0 145,14 160,14 148,23 152,37 140,28 128,37 132,23 120,14 135,14" fill="#FACC15"/>
      <polygon points="180,0 185,14 200,14 188,23 192,37 180,28 168,37 172,23 160,14 175,14" fill="#FACC15"/>
    </g>

    <text x="0" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#93C5FD" letter-spacing="3">
      TEAM MENTOR • 2027
    </text>
  </g>

  <!-- Left Editorial Labels -->
  <g transform="translate(88 120)">
    <!-- Tag Pill -->
    <rect width="210" height="34" rx="17" fill="#EAB308" fill-opacity="0.18" stroke="#FACC15" stroke-opacity="0.45"/>
    <text x="22" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FDE047" letter-spacing="1.5">
      CSK ICON RETIREMENT
    </text>

    <!-- Main Heading Lines -->
    <text x="0" y="95" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      MS Dhoni Retires
    </text>
    <text x="0" y="155" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="url(#csk_gold)" letter-spacing="-1">
      From IPL Playing Career
    </text>

    <!-- Subtitle / Meta -->
    <text x="0" y="215" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#94A3B8">
      19 Seasons • 5 Championships • Transitioning to CSK Team Mentor
    </text>

    <!-- Key Metrics Cards -->
    <g transform="translate(0 265)">
      <rect width="140" height="68" rx="14" fill="#0E1E38" stroke="#334155"/>
      <text x="18" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">TITLES</text>
      <text x="18" y="54" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#FACC15">5 Trophies</text>

      <rect x="156" width="160" height="68" rx="14" fill="#0E1E38" stroke="#334155"/>
      <text x="174" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">NEW ROLE</text>
      <text x="174" y="54" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#38BDF8">CSK Mentor</text>

      <rect x="332" width="180" height="68" rx="14" fill="#0E1E38" stroke="#334155"/>
      <text x="350" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">TENURE</text>
      <text x="350" y="54" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">2008 – 2026</text>
    </g>
  </g>
</svg>