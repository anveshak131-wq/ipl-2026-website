<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg_bethell" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140608"/>
      <stop offset="55%" stop-color="#240D12"/>
      <stop offset="100%" stop-color="#0E0507"/>
    </linearGradient>
    <radialGradient id="glow_rcb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 280) rotate(135) scale(460)">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#EAB308" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rcb_red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="rcb_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg_bethell)"/>
  <rect width="1200" height="675" fill="url(#glow_rcb)"/>

  <!-- Field Lines Grid -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Right Visual: RCB Shield & Knee Recovery Emblem -->
  <g transform="translate(860 330)">
    <circle cx="0" cy="0" r="165" stroke="url(#rcb_red)" stroke-width="2" stroke-dasharray="8 6" opacity="0.35"/>
    <circle cx="0" cy="0" r="125" fill="#1C090D" stroke="url(#rcb_gold)" stroke-width="3" opacity="0.95"/>
    
    <!-- Medical Cross / Shield Silhouette -->
    <path d="M-22 -45 L22 -45 L22 -22 L45 -22 L45 22 L22 22 L22 45 L-22 45 L-22 22 L-45 22 L-45 -22 L-22 -22 Z" fill="url(#rcb_red)"/>
    
    <text x="0" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FCA5A5" letter-spacing="2">
      KNEE SURGERY REHAB
    </text>
    <text x="0" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FDE047" letter-spacing="1">
      OVERSEAS SLOT VACATED
    </text>
  </g>

  <!-- Left Content -->
  <g transform="translate(88 120)">
    <!-- Tag Pill -->
    <rect width="230" height="34" rx="17" fill="#DC2626" fill-opacity="0.20" stroke="#EF4444" stroke-opacity="0.5"/>
    <text x="22" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FCA5A5" letter-spacing="1.5">
      RCB SQUAD UPDATE • 2027
    </text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="system-ui, sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      Jacob Bethell Pulls Out
    </text>
    <text x="0" y="155" font-family="system-ui, sans-serif" font-size="50" font-weight="900" fill="url(#rcb_gold)" letter-spacing="-1">
      Of IPL 2027 Season
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" font-family="system-ui, sans-serif" font-size="19" font-weight="500" fill="#CBD5E1">
      Persistent Knee Cartilage Injury • Surgery Required • Released by Champions RCB
    </text>

    <!-- Metric Badges -->
    <g transform="translate(0 265)">
      <rect width="160" height="68" rx="14" fill="#240D12" stroke="#451A22"/>
      <text x="18" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">FRANCHISE</text>
      <text x="18" y="54" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#EF4444">RCB Release</text>

      <rect x="176" width="180" height="68" rx="14" fill="#240D12" stroke="#451A22"/>
      <text x="194" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">REASON</text>
      <text x="194" y="54" font-family="system-ui, sans-serif" font-size="19" font-weight="900" fill="#FDE047">Right Knee Surgery</text>

      <rect x="372" width="160" height="68" rx="14" fill="#240D12" stroke="#451A22"/>
      <text x="390" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">IMPACT</text>
      <text x="390" y="54" font-family="system-ui, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF">1 Overseas Slot</text>
    </g>
  </g>
</svg>