<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg_ret" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070F26"/>
      <stop offset="55%" stop-color="#0D2040"/>
      <stop offset="100%" stop-color="#050C1F"/>
    </linearGradient>
    <radialGradient id="glow_ret" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 280) rotate(135) scale(460)">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g_blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="g_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg_ret)"/>
  <rect width="1200" height="675" fill="url(#glow_ret)"/>

  <!-- Tactical Grid -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Right Visual: Financial Tally Board Graphic -->
  <g transform="translate(860 325)">
    <circle cx="0" cy="0" r="165" stroke="url(#g_blue)" stroke-width="2" stroke-dasharray="10 6" opacity="0.4"/>
    <rect x="-135" y="-120" width="270" height="240" rx="20" fill="#0A1833" stroke="url(#g_gold)" stroke-width="2" opacity="0.95"/>

    <text x="0" y="-80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94A3B8" letter-spacing="2">
      TOTAL PLAYERS RETAINED
    </text>
    <text x="0" y="-35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#FACC15">
      184
    </text>

    <line x1="-110" y1="-10" x2="110" y2="-10" stroke="#334155" stroke-width="1"/>

    <text x="0" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94A3B8" letter-spacing="2">
      REMAINING PURSE
    </text>
    <text x="0" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#34D399">
      ₹297.95 Cr
    </text>
    <text x="0" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#93C5FD">
      66 Open Slots Across 10 Teams
    </text>
  </g>

  <!-- Left Editorial Labels -->
  <g transform="translate(88 120)">
    <rect width="250" height="34" rx="17" fill="#3B82F6" fill-opacity="0.2" stroke="#60A5FA" stroke-opacity="0.45"/>
    <text x="22" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#93C5FD" letter-spacing="1.5">
      OFFICIAL RETENTIONS &amp; RELEASES
    </text>

    <text x="0" y="95" font-family="system-ui, sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      All 10 IPL Teams
    </text>
    <text x="0" y="155" font-family="system-ui, sans-serif" font-size="50" font-weight="900" fill="url(#g_gold)" letter-spacing="-1">
      Finalize 2027 Squads
    </text>

    <text x="0" y="215" font-family="system-ui, sans-serif" font-size="19" font-weight="500" fill="#CBD5E1">
      184 Stars Locked • ₹1,002 Cr Committed • Top Names Enter Goa Auction Pool
    </text>

    <g transform="translate(0 265)">
      <rect width="160" height="68" rx="14" fill="#0C1F3D" stroke="#1E3A8A"/>
      <text x="18" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">HIGHEST PURSE</text>
      <text x="18" y="54" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#34D399">LSG: ₹47.45 Cr</text>

      <rect x="176" width="165" height="68" rx="14" fill="#0C1F3D" stroke="#1E3A8A"/>
      <text x="194" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">MINI-AUCTION</text>
      <text x="194" y="54" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#FACC15">Dec 16 • Goa</text>

      <rect x="357" width="165" height="68" rx="14" fill="#0C1F3D" stroke="#1E3A8A"/>
      <text x="375" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">SALARY CEILING</text>
      <text x="375" y="54" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">₹157 Cr / Team</text>
    </g>
  </g>
</svg>