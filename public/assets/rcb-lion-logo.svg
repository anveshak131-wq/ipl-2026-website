<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes rcbPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.08); }
      }
      @keyframes rcbGlow {
        0%, 100% { filter: drop-shadow(0 0 5px #EC1C24) drop-shadow(0 0 12px rgba(236, 28, 36, 0.4)); }
        50% { filter: drop-shadow(0 0 15px #EC1C24) drop-shadow(0 0 30px #FF6B6B) drop-shadow(0 0 45px rgba(236, 28, 36, 0.3)); }
      }
      @keyframes rcbGradientShift {
        0% { stop-color: #EC1C24; }
        25% { stop-color: #FF3333; }
        50% { stop-color: #FF4757; }
        75% { stop-color: #FF3333; }
        100% { stop-color: #EC1C24; }
      }
      @keyframes crownShine {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes crownRotate {
        0% { transform: rotateZ(-2deg); }
        50% { transform: rotateZ(2deg); }
        100% { transform: rotateZ(-2deg); }
      }
      @keyframes textFlicker {
        0%, 100% { opacity: 1; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
        50% { opacity: 0.95; text-shadow: 0 0 20px rgba(255, 215, 0, 1); }
      }
      @keyframes bgRotate {
        0% { transform: rotateZ(0deg); }
        100% { transform: rotateZ(360deg); }
      }
      .rcb-bg { 
        animation: rcbPulse 3s ease-in-out infinite; 
        transform-origin: center;
      }
      .rcb-glow { 
        animation: rcbGlow 2.5s ease-in-out infinite;
        transform-origin: center;
      }
      .rcb-gradient-stop { 
        animation: rcbGradientShift 4s ease-in-out infinite; 
      }
      .crown { 
        animation: crownShine 2.5s ease-in-out infinite, crownRotate 3s ease-in-out infinite;
        transform-origin: 100px 100px;
      }
      .rcb-text { 
        animation: textFlicker 2s ease-in-out infinite;
      }
      .rotating-ring {
        animation: bgRotate 6s linear infinite;
        transform-origin: center;
      }
    </style>
    <linearGradient id="rcbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="rcb-gradient-stop" style="stop-color:#EC1C24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#990000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#660000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE66D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rotating outer ring accent -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3" class="rotating-ring" stroke-dasharray="8,4"/>
  
  <!-- Main background -->
  <rect width="200" height="200" rx="40" fill="url(#rcbGradient)" class="rcb-bg rcb-glow"/>
  
  <!-- Inner highlight -->
  <rect width="200" height="200" rx="40" fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.3"/>
  
  <!-- Crown with enhanced animation -->
  <g class="crown">
    <path d="M 60 140 L 40 100 L 60 100 L 70 80 L 80 100 L 100 100 L 120 80 L 130 100 L 150 100 L 140 140 Z" 
          fill="url(#goldGradient)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <!-- Crown jewels -->
    <circle cx="70" cy="88" r="4" fill="#FFE66D" opacity="0.9"/>
    <circle cx="100" cy="70" r="5" fill="#FFE66D" opacity="1"/>
    <circle cx="130" cy="88" r="4" fill="#FFE66D" opacity="0.9"/>
  </g>
  
  <!-- Animated RCB text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#fff" class="rcb-text">RCB</text>
  
  <!-- Sparkle effects -->
  <circle cx="40" cy="50" r="2" fill="#FFD700" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="50" r="2" fill="#FFD700" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="100" r="1.5" fill="#FFD700" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="100" r="1.5" fill="#FFD700" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>

