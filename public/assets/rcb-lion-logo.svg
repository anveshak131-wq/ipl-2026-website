<?xml version="1.0" encoding="UTF-8"?>
<!-- Premium RCB Logo - Clean Geometric Shield Design -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" role="img" aria-label="RCB logo">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="40%" stop-color="#EC1C24" />
      <stop offset="80%" stop-color="#D91F1F" />
      <stop offset="100%" stop-color="#A31820" />
    </linearGradient>
    <filter id="shieldShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Shield body -->
  <path d="M 120,20 L 170,50 L 180,140 Q 180,160 120,170 Q 60,160 60,140 L 70,50 Z" 
        fill="url(#shieldGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" filter="url(#shieldShadow)"/>
  
  <!-- Shield highlight -->
  <path d="M 120,20 L 170,50 L 180,140 Q 180,160 120,170 Q 60,160 60,140 L 70,50 Z" 
        fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  
  <!-- Center vertical stripe -->
  <line x1="120" y1="30" x2="120" y2="165" stroke="#FFD24D" stroke-width="12" stroke-linecap="round" opacity="0.65"/>
  
  <!-- Top V accent -->
  <path d="M 90,60 L 120,85 L 150,60" stroke="#FFE66D" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  
  <!-- Bottom three dots -->
  <circle cx="85" cy="130" r="5" fill="#FFD24D" opacity="0.5"/>
  <circle cx="120" cy="145" r="5" fill="#FFD24D" opacity="0.55"/>
  <circle cx="155" cy="130" r="5" fill="#FFD24D" opacity="0.5"/>
  
  <!-- Outer dashed ring -->
  <circle cx="120" cy="95" r="75" fill="none" stroke="#FFD24D" stroke-width="1" stroke-dasharray="4,2" opacity="0.35"/>
</svg>

