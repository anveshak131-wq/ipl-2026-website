<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes rcbPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.92; transform: scale(1.12); } }
      @keyframes rcbGlow { 0%, 100% { filter: drop-shadow(0 0 5px #EC1C24) drop-shadow(0 0 12px rgba(236, 28, 36, 0.4)); } 50% { filter: drop-shadow(0 0 20px #EC1C24) drop-shadow(0 0 40px #FF6B6B) drop-shadow(0 0 60px rgba(236, 28, 36, 0.2)); } }
      @keyframes rcbGradientShift { 0% { stop-color: #EC1C24; } 25% { stop-color: #FF4444; } 50% { stop-color: #FF6B6B; } 75% { stop-color: #FF4444; } 100% { stop-color: #EC1C24; } }
      @keyframes crownShine { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
      @keyframes crownRotate { 0% { transform: rotateZ(-3deg); } 50% { transform: rotateZ(3deg); } 100% { transform: rotateZ(-3deg); } }
      @keyframes textFlicker { 0%, 100% { opacity: 1; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.3); } 50% { opacity: 0.92; text-shadow: 0 0 30px rgba(255, 215, 0, 1), 0 0 50px rgba(255, 200, 0, 0.6); } }
      @keyframes bgRotate { 0% { transform: rotateZ(0deg); } 100% { transform: rotateZ(360deg); } }
      @keyframes particleBurst { 0% { opacity: 1; } 100% { opacity: 0; } }
      .rcb-bg { animation: rcbPulse 3.5s ease-in-out infinite; transform-origin: center; }
      .rcb-glow { animation: rcbGlow 2.8s ease-in-out infinite; transform-origin: center; }
      .rcb-gradient-stop { animation: rcbGradientShift 4.5s ease-in-out infinite; }
      .crown { animation: crownShine 2.8s ease-in-out infinite, crownRotate 3.5s ease-in-out infinite; transform-origin: 100px 100px; }
      .rcb-text { animation: textFlicker 2.2s ease-in-out infinite; }
      .rotating-ring { animation: bgRotate 7s linear infinite; transform-origin: center; }
      .counter-ring { animation: bgRotate 10s linear reverse infinite; transform-origin: center; }
      .pulse-ring { animation: rcbPulse 2.8s ease-in-out infinite; transform-origin: center; }
    </style>
    <linearGradient id="rcbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="rcb-gradient-stop" style="stop-color:#EC1C24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#990000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#660000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FFE66D;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <filter id="deepGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Deep glow layers -->
  <circle cx="100" cy="100" r="110" fill="#8B0000" opacity="0.2" class="rcb-bg" filter="url(#deepGlow)"/>
  <circle cx="100" cy="100" r="100" fill="#EC1C24" opacity="0.15" class="rcb-bg"/>
  
  <!-- Rotating rings -->
  <circle cx="100" cy="100" r="125" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3" class="rotating-ring" stroke-dasharray="8,4"/>
  <circle cx="100" cy="100" r="140" fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.2" class="counter-ring" stroke-dasharray="6,6"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FF6B6B" stroke-width="1.5" opacity="0.25" class="pulse-ring"/>
  
  <!-- Main background -->
  <rect width="200" height="200" rx="40" fill="url(#rcbGradient)" class="rcb-bg rcb-glow"/>
  
  <!-- Inner highlights -->
  <rect width="200" height="200" rx="40" fill="none" stroke="#FF8888" stroke-width="2.5" opacity="0.4"/>
  <rect x="3" y="3" width="194" height="194" rx="38" fill="none" stroke="#FFE5E5" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Crown with enhanced animation -->
  <g class="crown">
    <path d="M 60 140 L 40 100 L 60 100 L 70 80 L 80 100 L 100 100 L 120 80 L 130 100 L 150 100 L 140 140 Z" 
          fill="url(#goldGradient)" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#deepGlow)"/>
    <!-- Crown jewels with individual sparkles -->
    <circle cx="70" cy="88" r="4.5" fill="#FFE66D" opacity="0.95" filter="url(#deepGlow)">
      <animate attributeName="r" values="4.5;6;4.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;1;0.95" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="70" r="5.5" fill="#FFE66D" opacity="1" filter="url(#deepGlow)">
      <animate attributeName="r" values="5.5;7.5;5.5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.8;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="88" r="4.5" fill="#FFE66D" opacity="0.95" filter="url(#deepGlow)">
      <animate attributeName="r" values="4.5;6;4.5" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;1;0.95" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Animated RCB text with multi-layer effect -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#FFD700" opacity="0.3" class="rcb-text">RCB</text>
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#FFE66D" opacity="0.6" class="rcb-text">RCB</text>
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#fff" class="rcb-text">RCB</text>
  
  <!-- Sparkle effects -->
  <g opacity="0.7">
    <circle cx="35" cy="50" r="2.5" fill="#FFD700">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;4;2.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="165" cy="50" r="2.5" fill="#FFD700">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;4;2.5" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="100" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3.5;2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="100" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3.5;2" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="25" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3;2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

