<?xml version="1.0" encoding="UTF-8"?>
<!-- Redesigned RCB lion static SVG - compact, modern, optimized for UI -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260" role="img" aria-label="RCB lion logo">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFB3B3" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#EC1C24" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#EC1C24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rcbGradient" x1="0" x2="1">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#EC1C24" />
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle - crimson -->
  <circle cx="120" cy="80" r="78" fill="url(#rcbGradient)" />
  <circle cx="120" cy="80" r="96" fill="url(#bgGlow)" />

  <!-- Rotating subtle ring (static for SVG) -->
  <g opacity="0.08">
    <path d="M120 8 A72 72 0 1 1 119.9 8" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" />
  </g>

  <!-- Lion face container -->
  <g transform="translate(120,100)">
    <!-- Outer mane silhouette -->
    <path d="M0,-68 C-44,-62 -72,-36 -72,0 C-72,36 -44,62 0,72 C44,62 72,36 72,0 C72,-36 44,-62 0,-68 Z" fill="#C96A12" filter="url(#softGlow)" />

    <!-- Inner mane layer -->
    <path d="M0,-56 C-34,-50 -56,-30 -56,0 C-56,30 -34,50 0,58 C34,50 56,30 56,0 C56,-30 34,-50 0,-56 Z" fill="#F8C97E" />

    <!-- Face -->
    <circle cx="0" cy="-6" r="36" fill="#FDD08D" stroke="#CE9A5A" stroke-width="1.5" />

    <!-- Angry eyes (slits) -->
    <g fill="#111">
      <path d="M-18,-18 q6 -6 18 -2" stroke="#111" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M18,-18 q-6 -6 -18 -2" stroke="#111" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>

    <!-- Eyebrows -->
    <g stroke="#6b3e26" stroke-width="5" stroke-linecap="round">
      <path d="M-34,-30 L-12,-18" />
      <path d="M34,-30 L12,-18" />
    </g>

    <!-- Nose -->
    <path d="M -6 2 Q 0 12 6 2 Q 0 8 -6 2 Z" fill="#5A2F25" />

    <!-- Snarl / mouth -->
    <path d="M -18 20 Q 0 30 18 20" stroke="#5A2F25" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M -6 18 L -6 24 M 6 18 L 6 24" stroke="#5A2F25" stroke-width="2" stroke-linecap="round" />

    <!-- Crown (clean, small) -->
    <g transform="translate(-22,-64)">
      <rect x="0" y="28" width="44" height="10" rx="2" fill="#FFD24D" />
      <path d="M4 28 L12 0 L20 28 L28 6 L36 28" fill="#FFD24D" />
      <circle cx="12" cy="0" r="3" fill="#D49B00" />
      <circle cx="28" cy="6" r="2.2" fill="#D49B00" />
    </g>
  </g>

  <!-- Bold RCB label centered -->
  <text x="120" y="230" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#EC1C24" style="letter-spacing:1.5px">RCB</text>
</svg>
