<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gt-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#004BA0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003D7A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gt-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55A2B;stop-opacity:1" />
    </linearGradient>
    <filter id="gt-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes roar {
        0%, 100% { transform: scale(1) rotate(0deg); }
        25% { transform: scale(1.1) rotate(-2deg); }
        75% { transform: scale(1.1) rotate(2deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
      }
      .titan { animation: roar 3s ease-in-out infinite; }
      .logo-pulse { animation: pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#gt-blue-grad)" class="logo-pulse" filter="url(#gt-glow)"/>
  
  <!-- Titan Head -->
  <g class="titan">
    <circle cx="100" cy="85" r="35" fill="url(#gt-orange-grad)" opacity="0.9"/>
    <circle cx="90" cy="80" r="6" fill="#FFF"/>
    <circle cx="110" cy="80" r="6" fill="#FFF"/>
    <path d="M 85 95 Q 100 105 115 95" stroke="#FFF" stroke-width="3" fill="none"/>
    <path d="M 100 100 L 100 120" stroke="url(#gt-orange-grad)" stroke-width="4"/>
  </g>
  
  <!-- GT Text -->
  <text x="100" y="150" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#FF6B35" text-anchor="middle" opacity="0.95">GT</text>
</svg>

