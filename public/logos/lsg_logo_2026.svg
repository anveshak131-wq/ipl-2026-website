<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lsgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C2A2C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lsgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7E17D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="url(#lsgGradient)" stroke="url(#lsgGold)" stroke-width="4"/>
  
  <!-- Inner decorative ring -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#lsgGold)" stroke-width="2" opacity="0.6"/>
  
  <!-- Super Giant silhouette -->
  <path d="M 100 50 L 140 70 L 150 100 L 140 130 L 100 150 L 60 130 L 50 100 L 60 70 Z" 
        fill="url(#lsgGold)"/>
  
  <!-- Head detail -->
  <circle cx="100" cy="75" r="15" fill="#9C2A2C"/>
  
  <!-- Shoulder pads -->
  <path d="M 60 70 L 75 85 L 70 95 L 60 90 Z" fill="#9C2A2C"/>
  <path d="M 140 70 L 125 85 L 130 95 L 140 90 Z" fill="#9C2A2C"/>
  
  <!-- LSG Text -->
  <text x="100" y="175" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" 
        fill="url(#lsgGold)" text-anchor="middle">LSG</text>
</svg>

