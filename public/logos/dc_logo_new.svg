<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dc-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078BC" />
      <stop offset="100%" stop-color="#005A8A" />
    </linearGradient>
    <linearGradient id="dc-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF1B26" />
      <stop offset="100%" stop-color="#C8102E" />
    </linearGradient>
    <filter id="dc-glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#dc-blue)" opacity="0.1"/>
  
  <!-- Main Circle -->
  <circle cx="200" cy="200" r="170" fill="url(#dc-blue)" filter="url(#dc-glow)"/>
  
  <!-- Inner Circle -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#dc-red)" stroke-width="4"/>
  
  <!-- Capital Building Dome -->
  <g transform="translate(200, 160)">
    <!-- Dome -->
    <path d="M -40 0 Q 0 -30 40 0 L 35 20 L -35 20 Z" fill="url(#dc-red)"/>
    <!-- Pillars -->
    <rect x="-35" y="20" width="8" height="40" fill="url(#dc-red)"/>
    <rect x="-10" y="20" width="8" height="50" fill="url(#dc-red)"/>
    <rect x="2" y="20" width="8" height="50" fill="url(#dc-red)"/>
    <rect x="27" y="20" width="8" height="40" fill="url(#dc-red)"/>
    <!-- Base -->
    <rect x="-40" y="70" width="80" height="10" fill="url(#dc-red)"/>
  </g>
  
  <!-- DC Text -->
  <text x="200" y="280" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="4">DC</text>
  
  <!-- Stars -->
  <path d="M 130 130 L 133 137 L 140 137 L 135 142 L 137 149 L 130 144 L 123 149 L 125 142 L 120 137 L 127 137 Z" 
        fill="#FFFFFF" opacity="0.8"/>
  <path d="M 270 130 L 273 137 L 280 137 L 275 142 L 277 149 L 270 144 L 263 149 L 265 142 L 260 137 L 267 137 Z" 
        fill="#FFFFFF" opacity="0.8"/>
</svg>
