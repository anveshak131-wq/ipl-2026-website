<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dc-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078BC" />
      <stop offset="100%" stop-color="#005A8A" />
    </linearGradient>
    <linearGradient id="dc-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF1B26" />
      <stop offset="100%" stop-color="#C8102E" />
    </linearGradient>
    <radialGradient id="dc-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0078BC" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0078BC" stop-opacity="0" />
    </radialGradient>
    <filter id="dc-shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#dc-glow)"/>
  
  <!-- Main Circle -->
  <circle cx="200" cy="200" r="170" fill="url(#dc-blue-grad)" filter="url(#dc-shadow)"/>
  
  <!-- Inner Border -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#dc-red-grad)" stroke-width="4"/>
  
  <!-- Capital Building -->
  <g transform="translate(200, 150)">
    <!-- Dome -->
    <path d="M -45 0 Q 0 -35 45 0 L 40 25 L -40 25 Z" fill="url(#dc-red-grad)"/>
    <!-- Pillars -->
    <rect x="-40" y="25" width="9" height="45" fill="url(#dc-red-grad)"/>
    <rect x="-15" y="25" width="9" height="55" fill="url(#dc-red-grad)"/>
    <rect x="6" y="25" width="9" height="55" fill="url(#dc-red-grad)"/>
    <rect x="31" y="25" width="9" height="45" fill="url(#dc-red-grad)"/>
    <!-- Base -->
    <rect x="-45" y="80" width="90" height="12" fill="url(#dc-red-grad)"/>
  </g>
  
  <!-- DC Text -->
  <text x="200" y="290" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="8">DC</text>
  
  <!-- Stars -->
  <path d="M 130 130 L 133 137 L 140 137 L 135 142 L 137 149 L 130 144 L 123 149 L 125 142 L 120 137 L 127 137 Z" 
        fill="#FFFFFF" opacity="0.9"/>
  <path d="M 270 130 L 273 137 L 280 137 L 275 142 L 277 149 L 270 144 L 263 149 L 265 142 L 260 137 L 267 137 Z" 
        fill="#FFFFFF" opacity="0.9"/>
</svg>
