<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kkr-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3A225D;stop-opacity:1">
        <animate attributeName="stop-color" values="#3A225D;#4A2A6D;#3A225D" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#2A153D;stop-opacity:1">
        <animate attributeName="stop-color" values="#2A153D;#3A225D;#2A153D" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="kkr-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B9975B;stop-opacity:1">
        <animate attributeName="stop-color" values="#B9975B;#D4AF37;#B9975B" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#8B7353;stop-opacity:1">
        <animate attributeName="stop-color" values="#8B7353;#B9975B;#8B7353" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="kkr-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur">
        <animate attributeName="stdDeviation" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield -->
  <path d="M 100 20 L 155 40 L 165 100 L 155 160 L 100 180 L 45 160 L 35 100 L 45 40 Z" 
        fill="url(#kkr-purple)" 
        stroke="url(#kkr-gold)" 
        stroke-width="3" 
        filter="url(#kkr-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- KKR Text -->
  <text x="100" y="110" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" 
        text-anchor="middle" fill="url(#kkr-gold)" filter="url(#kkr-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="3s" repeatCount="indefinite"/>
    KKR
  </text>
</svg>
