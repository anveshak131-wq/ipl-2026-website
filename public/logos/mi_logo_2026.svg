<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="miGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004BA0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="miGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#004BA0;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#004BA0;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#miGradient)" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  
  <!-- Mumbai skyline silhouette -->
  <path d="M 30 140 L 40 120 L 50 130 L 60 110 L 70 125 L 80 105 L 90 115 L 100 100 L 110 115 L 120 105 L 130 125 L 140 110 L 150 130 L 160 120 L 170 140 Z" 
        fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Star elements -->
  <path d="M 100 30 L 105 45 L 120 45 L 108 55 L 113 70 L 100 62 L 87 70 L 92 55 L 80 45 L 95 45 Z" 
        fill="#FFFFFF"/>
  <circle cx="100" cy="100" r="3" fill="#FFFFFF"/>
  
  <!-- MI Text -->
  <text x="100" y="175" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle">MI</text>
</svg>

