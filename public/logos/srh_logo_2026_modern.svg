<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="srh-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55A2B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="srh-black-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <filter id="srh-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes rise {
        0% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.1); }
        100% { transform: translateY(0) scale(1); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
      }
      .sun { animation: rise 4s ease-in-out infinite; }
      .logo-pulse { animation: pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#srh-orange-grad)" class="logo-pulse" filter="url(#srh-glow)"/>
  
  <!-- Sun -->
  <g class="sun">
    <circle cx="100" cy="100" r="40" fill="url(#srh-black-grad)" opacity="0.9"/>
    <circle cx="100" cy="100" r="30" fill="url(#srh-orange-grad)"/>
    <!-- Sun Rays -->
    <line x1="100" y1="30" x2="100" y2="50" stroke="url(#srh-black-grad)" stroke-width="4" opacity="0.8"/>
    <line x1="100" y1="150" x2="100" y2="170" stroke="url(#srh-black-grad)" stroke-width="4" opacity="0.8"/>
    <line x1="30" y1="100" x2="50" y2="100" stroke="url(#srh-black-grad)" stroke-width="4" opacity="0.8"/>
    <line x1="150" y1="100" x2="170" y2="100" stroke="url(#srh-black-grad)" stroke-width="4" opacity="0.8"/>
  </g>
  
  <!-- SRH Text -->
  <text x="100" y="155" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#1A1A1A" text-anchor="middle" opacity="0.95">SRH</text>
</svg>

