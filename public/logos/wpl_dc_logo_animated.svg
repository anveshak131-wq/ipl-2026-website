<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blue to Purple Gradient -->
    <linearGradient id="dc-blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004BA0">
        <animate attributeName="stop-color" values="#004BA0;#0066CC;#004BA0" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#A855F7;#7C3AED" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <!-- Red Gradient (Tigers) -->
    <linearGradient id="dc-red-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F87171" />
    </linearGradient>
    
    <!-- Gold Accent -->
    <linearGradient id="dc-gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    
    <!-- Radial Glow -->
    <radialGradient id="dc-glow-gradient" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#004BA0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#004BA0" stop-opacity="0" />
    </radialGradient>
    
    <!-- Shadow Filter -->
    <filter id="dc-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="4" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Glow Filter -->
    <filter id="dc-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Animated Background Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#dc-glow-gradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#dc-blue-gradient)" stroke-width="6" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 200 200;360 200 200" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main Logo Group -->
  <g transform="translate(200,200)" filter="url(#dc-shadow)">
    <!-- Shield Base -->
    <path d="M-85,-60 Q0,-80 85,-60 L75,50 Q0,70 -75,50 Z" fill="url(#dc-blue-gradient)" filter="url(#dc-glow)" opacity="0.95">
      <animate attributeName="opacity" values="0.95;1;0.95" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Parliament Building (Detailed) -->
    <g transform="translate(0,-25)">
      <!-- Main Building -->
      <rect x="-50" y="0" width="100" height="50" fill="#FFFFFF" opacity="0.95" rx="3">
        <animate attributeName="opacity" values="0.95;1;0.95" dur="2s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Left Tower -->
      <rect x="-45" y="-15" width="30" height="15" fill="#FFFFFF" opacity="0.95" rx="2"/>
      <rect x="-40" y="-20" width="20" height="5" fill="url(#dc-gold-gradient)" opacity="0.9"/>
      
      <!-- Right Tower -->
      <rect x="15" y="-15" width="30" height="15" fill="#FFFFFF" opacity="0.95" rx="2"/>
      <rect x="20" y="-20" width="20" height="5" fill="url(#dc-gold-gradient)" opacity="0.9"/>
      
      <!-- Central Dome -->
      <rect x="-20" y="-25" width="40" height="10" fill="#FFFFFF" opacity="0.95" rx="5"/>
      <ellipse cx="0" cy="-30" rx="15" ry="8" fill="url(#dc-gold-gradient)" opacity="0.9"/>
      
      <!-- Columns -->
      <line x1="-35" y1="0" x2="-35" y2="50" stroke="url(#dc-blue-gradient)" stroke-width="2" opacity="0.7"/>
      <line x1="35" y1="0" x2="35" y2="50" stroke="url(#dc-blue-gradient)" stroke-width="2" opacity="0.7"/>
    </g>
    
    <!-- Three Tigers (Detailed) -->
    <g transform="translate(-50,20)">
      <!-- Tiger 1 -->
      <g>
        <circle cx="0" cy="0" r="15" fill="url(#dc-red-gradient)" opacity="0.95">
          <animate attributeName="r" values="15;17;15" dur="2s" repeatCount="indefinite"/>
        </circle>
        <!-- Tiger Face -->
        <circle cx="-3" cy="-3" r="2" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="3" cy="-3" r="2" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="-3" cy="-3" r="1" fill="#000000" opacity="0.8"/>
        <circle cx="3" cy="-3" r="1" fill="#000000" opacity="0.8"/>
        <ellipse cx="0" cy="2" rx="2" ry="1.5" fill="#000000" opacity="0.7"/>
        <!-- Stripes -->
        <path d="M-8,-5 L-5,5 M8,-5 L5,5" stroke="#000000" stroke-width="1.5" opacity="0.6"/>
      </g>
    </g>
    <g transform="translate(0,20)">
      <!-- Tiger 2 -->
      <g>
        <circle cx="0" cy="0" r="15" fill="url(#dc-red-gradient)" opacity="0.95">
          <animate attributeName="r" values="15;17;15" dur="2s" begin="0.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-3" cy="-3" r="2" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="3" cy="-3" r="2" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="-3" cy="-3" r="1" fill="#000000" opacity="0.8"/>
        <circle cx="3" cy="-3" r="1" fill="#000000" opacity="0.8"/>
        <ellipse cx="0" cy="2" rx="2" ry="1.5" fill="#000000" opacity="0.7"/>
        <path d="M-8,-5 L-5,5 M8,-5 L5,5" stroke="#000000" stroke-width="1.5" opacity="0.6"/>
      </g>
    </g>
    <g transform="translate(50,20)">
      <!-- Tiger 3 -->
      <g>
        <circle cx="0" cy="0" r="15" fill="url(#dc-red-gradient)" opacity="0.95">
          <animate attributeName="r" values="15;17;15" dur="2s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-3" cy="-3" r="2" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="3" cy="-3" r="2" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="-3" cy="-3" r="1" fill="#000000" opacity="0.8"/>
        <circle cx="3" cy="-3" r="1" fill="#000000" opacity="0.8"/>
        <ellipse cx="0" cy="2" rx="2" ry="1.5" fill="#000000" opacity="0.7"/>
        <path d="M-8,-5 L-5,5 M8,-5 L5,5" stroke="#000000" stroke-width="1.5" opacity="0.6"/>
      </g>
    </g>
    
    <!-- DC Text -->
    <text x="0" y="85" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="bold" font-family="Arial, sans-serif" opacity="0.95" filter="url(#dc-glow)">DC</text>
    
    <!-- Decorative Elements -->
    <circle cx="-100" cy="-100" r="5" fill="url(#dc-gold-gradient)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="-100" r="5" fill="url(#dc-gold-gradient)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
