<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="csk-yellow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFF00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="csk-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0047AB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
    <filter id="csk-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes wave {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; }
      }
      .wave { animation: wave 3s ease-in-out infinite; }
      .logo-pulse { animation: pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#csk-yellow-grad)" class="logo-pulse" filter="url(#csk-glow)"/>
  
  <!-- Lion Head -->
  <g class="wave">
    <circle cx="100" cy="80" r="35" fill="url(#csk-blue-grad)" opacity="0.9"/>
    <circle cx="90" cy="75" r="5" fill="#FFF"/>
    <circle cx="110" cy="75" r="5" fill="#FFF"/>
    <path d="M 85 90 Q 100 100 115 90" stroke="#FFF" stroke-width="3" fill="none"/>
  </g>
  
  <!-- CSK Text -->
  <text x="100" y="145" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" fill="#0047AB" text-anchor="middle" opacity="0.95">CSK</text>
</svg>

