<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2130;stop-opacity:1">
        <animate attributeName="stop-color" values="#1B2130;#2A3441;#1B2130" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#2A3441;stop-opacity:1">
        <animate attributeName="stop-color" values="#2A3441;#1B2130;#2A3441" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="gtRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E15454;stop-opacity:1">
        <animate attributeName="stop-color" values="#E15454;#FF6B6B;#E15454" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1">
        <animate attributeName="stop-color" values="#FF6B6B;#E15454;#FF6B6B" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  
  <!-- Background with pulse -->
  <circle cx="100" cy="100" r="90" fill="url(#gtGradient)" stroke="url(#gtRed)" stroke-width="4">
    <animate attributeName="r" values="90;92;90" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner circle with rotation -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#gtRed)" stroke-width="2" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;-360 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Titan/Giant silhouette with subtle movement -->
  <path d="M 100 50 L 130 70 L 140 100 L 130 130 L 100 150 L 70 130 L 60 100 L 70 70 Z" 
        fill="url(#gtRed)">
    <animateTransform attributeName="transform" type="scale" values="1;1.02;1" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Shoulder details -->
  <path d="M 70 70 L 85 80 L 80 90 L 70 85 Z" fill="#1B2130">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 130 70 L 115 80 L 120 90 L 130 85 Z" fill="#1B2130">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <!-- Head detail with pulse -->
  <circle cx="100" cy="75" r="12" fill="#1B2130">
    <animate attributeName="r" values="12;13;12" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- GT Text -->
  <text x="100" y="175" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
        fill="url(#gtRed)" text-anchor="middle">
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
    GT
  </text>
</svg>

