<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gt-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2130;stop-opacity:1">
        <animate attributeName="stop-color" values="#1B2130;#2B3140;#1B2130" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#0B1120;stop-opacity:1">
        <animate attributeName="stop-color" values="#0B1120;#1B2130;#0B1120" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="gt-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E15454;stop-opacity:1">
        <animate attributeName="stop-color" values="#E15454;#F16464;#E15454" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#C14444;stop-opacity:1">
        <animate attributeName="stop-color" values="#C14444;#E15454;#C14444" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="gt-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur">
        <animate attributeName="stdDeviation" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield -->
  <path d="M 100 20 L 155 40 L 165 100 L 155 160 L 100 180 L 45 160 L 35 100 L 45 40 Z" 
        fill="url(#gt-dark)" 
        stroke="url(#gt-red)" 
        stroke-width="3" 
        filter="url(#gt-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- GT Text -->
  <text x="100" y="110" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
        text-anchor="middle" fill="url(#gt-red)" filter="url(#gt-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="3s" repeatCount="indefinite"/>
    GT
  </text>
</svg>
