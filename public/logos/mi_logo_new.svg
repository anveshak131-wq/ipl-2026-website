<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mi-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004BA0" />
      <stop offset="100%" stop-color="#003A7A" />
    </linearGradient>
    <linearGradient id="mi-light-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#004BA0" />
    </linearGradient>
    <filter id="mi-glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#mi-blue)" opacity="0.15"/>
  
  <!-- Main Circle -->
  <circle cx="200" cy="200" r="160" fill="url(#mi-blue)" filter="url(#mi-glow)"/>
  
  <!-- Inner Circle -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- Mumbai Skyline Silhouette -->
  <g transform="translate(200, 200)">
    <!-- Buildings -->
    <rect x="-80" y="-20" width="25" height="60" fill="#FFFFFF" opacity="0.9"/>
    <rect x="-50" y="-30" width="20" height="70" fill="#FFFFFF" opacity="0.9"/>
    <rect x="-25" y="-10" width="25" height="50" fill="#FFFFFF" opacity="0.9"/>
    <rect x="5" y="-40" width="30" height="80" fill="#FFFFFF" opacity="0.9"/>
    <rect x="40" y="-25" width="20" height="65" fill="#FFFFFF" opacity="0.9"/>
    <rect x="65" y="-15" width="25" height="55" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Gateway of India -->
    <path d="M -15 40 L -10 40 L -10 20 L -5 20 L -5 40 L 5 40 L 5 20 L 10 20 L 10 40 L 15 40" 
          fill="url(#mi-light-blue)" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  
  <!-- MI Text -->
  <text x="200" y="280" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="4">MI</text>
  
  <!-- Stars -->
  <path d="M 120 120 L 125 130 L 135 130 L 127 137 L 130 147 L 120 142 L 110 147 L 113 137 L 105 130 L 115 130 Z" 
        fill="#FFFFFF" opacity="0.8"/>
  <path d="M 280 120 L 283 127 L 290 127 L 285 132 L 287 139 L 280 135 L 273 139 L 275 132 L 270 127 L 277 127 Z" 
        fill="#FFFFFF" opacity="0.8"/>
</svg>
