<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mi-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004BA0" />
      <stop offset="100%" stop-color="#003A7A" />
    </linearGradient>
    <linearGradient id="mi-light-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#004BA0" />
    </linearGradient>
    <radialGradient id="mi-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#004BA0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#004BA0" stop-opacity="0" />
    </radialGradient>
    <filter id="mi-shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#mi-glow)"/>
  
  <!-- Main Circle -->
  <circle cx="200" cy="200" r="170" fill="url(#mi-blue-grad)" filter="url(#mi-shadow)"/>
  
  <!-- Inner Border -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- Mumbai Skyline -->
  <g transform="translate(200, 150)">
    <!-- Buildings -->
    <rect x="-90" y="0" width="20" height="50" fill="#FFFFFF" opacity="0.95"/>
    <rect x="-65" y="-10" width="18" height="60" fill="#FFFFFF" opacity="0.95"/>
    <rect x="-42" y="5" width="22" height="45" fill="#FFFFFF" opacity="0.95"/>
    <rect x="-15" y="-15" width="25" height="65" fill="#FFFFFF" opacity="0.95"/>
    <rect x="15" y="-5" width="20" height="55" fill="#FFFFFF" opacity="0.95"/>
    <rect x="40" y="0" width="18" height="50" fill="#FFFFFF" opacity="0.95"/>
    <rect x="63" y="10" width="22" height="40" fill="#FFFFFF" opacity="0.95"/>
  </g>
  
  <!-- MI Text -->
  <text x="200" y="280" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="8">MI</text>
  
  <!-- Wave Pattern -->
  <path d="M 100 200 Q 150 190 200 200 T 300 200" stroke="url(#mi-light-grad)" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
