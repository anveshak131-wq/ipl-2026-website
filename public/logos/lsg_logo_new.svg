<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lsg-maroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C2A2C" />
      <stop offset="100%" stop-color="#7A1F21" />
    </linearGradient>
    <linearGradient id="lsg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E17D" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <filter id="lsg-glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#lsg-maroon)" opacity="0.15"/>
  
  <!-- Main Circle -->
  <circle cx="200" cy="200" r="165" fill="url(#lsg-maroon)" filter="url(#lsg-glow)"/>
  
  <!-- Inner Circle -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="url(#lsg-gold)" stroke-width="5"/>
  
  <!-- Elephant Head -->
  <g transform="translate(200, 180)">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="50" ry="40" fill="url(#lsg-gold)"/>
    <!-- Trunk -->
    <ellipse cx="0" cy="25" rx="15" ry="30" fill="url(#lsg-gold)"/>
    <!-- Ear -->
    <ellipse cx="-35" cy="-10" rx="20" ry="25" fill="url(#lsg-gold)"/>
    <ellipse cx="35" cy="-10" rx="20" ry="25" fill="url(#lsg-gold)"/>
    <!-- Eye -->
    <circle cx="-15" cy="-5" r="5" fill="#9C2A2C"/>
    <circle cx="15" cy="-5" r="5" fill="#9C2A2C"/>
    <!-- Tusk -->
    <path d="M -25 10 L -30 25 L -20 25 Z" fill="#FFFFFF"/>
    <path d="M 25 10 L 30 25 L 20 25 Z" fill="#FFFFFF"/>
  </g>
  
  <!-- LSG Text -->
  <text x="200" y="280" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" 
        fill="url(#lsg-gold)" text-anchor="middle" letter-spacing="3">LSG</text>
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="150" r="3" fill="url(#lsg-gold)"/>
  <circle cx="250" cy="150" r="3" fill="url(#lsg-gold)"/>
  <circle cx="150" cy="250" r="3" fill="url(#lsg-gold)"/>
  <circle cx="250" cy="250" r="3" fill="url(#lsg-gold)"/>
</svg>
