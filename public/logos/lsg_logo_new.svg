<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lsg-maroon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C2A2C" />
      <stop offset="100%" stop-color="#7A1F21" />
    </linearGradient>
    <linearGradient id="lsg-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E17D" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <radialGradient id="lsg-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#9C2A2C" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9C2A2C" stop-opacity="0" />
    </radialGradient>
    <filter id="lsg-shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#lsg-glow)"/>
  
  <!-- Main Circle -->
  <circle cx="200" cy="200" r="170" fill="url(#lsg-maroon-grad)" filter="url(#lsg-shadow)"/>
  
  <!-- Inner Border -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#lsg-gold-grad)" stroke-width="5"/>
  
  <!-- Elephant Icon -->
  <g transform="translate(200, 170)">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="55" ry="45" fill="url(#lsg-gold-grad)"/>
    <!-- Trunk -->
    <ellipse cx="0" cy="30" rx="18" ry="35" fill="url(#lsg-gold-grad)"/>
    <!-- Ears -->
    <ellipse cx="-40" cy="-8" rx="25" ry="30" fill="url(#lsg-gold-grad)"/>
    <ellipse cx="40" cy="-8" rx="25" ry="30" fill="url(#lsg-gold-grad)"/>
    <!-- Eyes -->
    <circle cx="-18" cy="-3" r="6" fill="#9C2A2C"/>
    <circle cx="18" cy="-3" r="6" fill="#9C2A2C"/>
    <!-- Tusks -->
    <path d="M -28 12 L -33 28 L -23 28 Z" fill="#FFFFFF"/>
    <path d="M 28 12 L 33 28 L 23 28 Z" fill="#FFFFFF"/>
  </g>
  
  <!-- LSG Text -->
  <text x="200" y="290" font-family="Arial Black, sans-serif" font-size="40" font-weight="900" 
        fill="url(#lsg-gold-grad)" text-anchor="middle" letter-spacing="4">LSG</text>
  
  <!-- Corner Dots -->
  <circle cx="150" cy="150" r="4" fill="url(#lsg-gold-grad)" opacity="0.8"/>
  <circle cx="250" cy="150" r="4" fill="url(#lsg-gold-grad)" opacity="0.8"/>
  <circle cx="150" cy="250" r="4" fill="url(#lsg-gold-grad)" opacity="0.8"/>
  <circle cx="250" cy="250" r="4" fill="url(#lsg-gold-grad)" opacity="0.8"/>
</svg>
