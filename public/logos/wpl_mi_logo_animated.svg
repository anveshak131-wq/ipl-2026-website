<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Mumbai Indians WPL - Blue & Gold Shield -->
  <defs>
    <linearGradient id="mi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004BA0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mi-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield Background -->
  <path d="M100 10 L170 40 L170 110 Q170 150 100 190 Q30 150 30 110 L30 40 Z" 
        fill="url(#mi-grad)" stroke="url(#mi-gold)" stroke-width="3"/>
  
  <!-- MI Letters -->
  <text x="100" y="100" font-family="Arial Black, sans-serif" font-size="60" 
        font-weight="bold" fill="url(#mi-gold)" text-anchor="middle" 
        dominant-baseline="middle">MI</text>
  
  <!-- Subtitle -->
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="16" 
        font-weight="bold" fill="#FFD700" text-anchor="middle">WOMEN</text>
  
  <!-- Cricket Ball -->
  <circle cx="100" cy="165" r="8" fill="#FFD700"/>
  <path d="M95 165 Q100 160 105 165" stroke="#004BA0" stroke-width="2" fill="none"/>
  <path d="M95 165 Q100 170 105 165" stroke="#004BA0" stroke-width="2" fill="none"/>
</svg>
