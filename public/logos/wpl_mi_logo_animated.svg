<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blue to Cyan Gradient (Mumbai Indians) -->
    <linearGradient id="mi-blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004BA0">
        <animate attributeName="stop-color" values="#004BA0;#0066CC;#004BA0" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#00A8E8">
        <animate attributeName="stop-color" values="#00A8E8;#00C4FF;#00A8E8" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <!-- Gold Accent Gradient -->
    <linearGradient id="mi-gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>
    
    <!-- Radial Glow -->
    <radialGradient id="mi-glow-gradient" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0066CC" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0066CC" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0066CC" stop-opacity="0" />
    </radialGradient>
    
    <!-- Shadow Filter -->
    <filter id="mi-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="4" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Glow Filter -->
    <filter id="mi-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Animated Background Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#mi-glow-gradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#mi-blue-gradient)" stroke-width="6" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 200 200;360 200 200" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main Logo Group -->
  <g transform="translate(200,200)" filter="url(#mi-shadow)">
    <!-- Shield Base -->
    <path d="M-80,-60 Q0,-80 80,-60 L70,60 Q0,80 -70,60 Z" fill="url(#mi-blue-gradient)" filter="url(#mi-glow)" opacity="0.95">
      <animate attributeName="opacity" values="0.95;1;0.95" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Sudarshana Chakra (Detailed) -->
    <g transform="translate(0,-10)">
      <!-- Outer Chakra Ring -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="url(#mi-gold-gradient)" stroke-width="5" stroke-dasharray="6 3" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="10s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Inner Chakra Ring -->
      <circle cx="0" cy="0" r="40" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 6" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="360 0 0;0 0 0" dur="8s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Chakra Spokes (8 spokes) -->
      <g>
        <line x1="0" y1="0" x2="0" y2="-48" stroke="url(#mi-gold-gradient)" stroke-width="3" stroke-linecap="round" opacity="0.9">
          <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="10s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="0" y2="-48" stroke="url(#mi-gold-gradient)" stroke-width="3" stroke-linecap="round" opacity="0.9" transform="rotate(45)">
          <animateTransform attributeName="transform" type="rotate" values="45 0 0;405 0 0" dur="10s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="0" y2="-48" stroke="url(#mi-gold-gradient)" stroke-width="3" stroke-linecap="round" opacity="0.9" transform="rotate(90)">
          <animateTransform attributeName="transform" type="rotate" values="90 0 0;450 0 0" dur="10s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="0" y2="-48" stroke="url(#mi-gold-gradient)" stroke-width="3" stroke-linecap="round" opacity="0.9" transform="rotate(135)">
          <animateTransform attributeName="transform" type="rotate" values="135 0 0;495 0 0" dur="10s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="0" y2="-48" stroke="url(#mi-gold-gradient)" stroke-width="3" stroke-linecap="round" opacity="0.9" transform="rotate(180)">
          <animateTransform attributeName="transform" type="rotate" values="180 0 0;540 0 0" dur="10s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="0" y2="-48" stroke="url(#mi-gold-gradient)" stroke-width="3" stroke-linecap="round" opacity="0.9" transform="rotate(225)">
          <animateTransform attributeName="transform" type="rotate" values="225 0 0;585 0 0" dur="10s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="0" y2="-48" stroke="url(#mi-gold-gradient)" stroke-width="3" stroke-linecap="round" opacity="0.9" transform="rotate(270)">
          <animateTransform attributeName="transform" type="rotate" values="270 0 0;630 0 0" dur="10s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="0" y2="-48" stroke="url(#mi-gold-gradient)" stroke-width="3" stroke-linecap="round" opacity="0.9" transform="rotate(315)">
          <animateTransform attributeName="transform" type="rotate" values="315 0 0;675 0 0" dur="10s" repeatCount="indefinite"/>
        </line>
      </g>
      
      <!-- Center Circle -->
      <circle cx="0" cy="0" r="25" fill="url(#mi-blue-gradient)" filter="url(#mi-glow)"/>
      <circle cx="0" cy="0" r="18" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="0" cy="0" r="12" fill="url(#mi-gold-gradient)"/>
      
      <!-- MI Text -->
      <text x="0" y="6" text-anchor="middle" fill="#004BA0" font-size="16" font-weight="bold" font-family="Arial, sans-serif" opacity="0.95">MI</text>
    </g>
    
    <!-- Decorative Stars (6 stars) -->
    <g>
      <path d="M-120,-100 L-118,-92 L-120,-90 L-122,-92 Z" fill="url(#mi-gold-gradient)" opacity="0.8">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M120,-100 L122,-92 L120,-90 L118,-92 Z" fill="url(#mi-gold-gradient)" opacity="0.8">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="0.3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      </path>
      <path d="M-140,-60 L-138,-52 L-140,-50 L-142,-52 Z" fill="url(#mi-gold-gradient)" opacity="0.7">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="0.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </path>
      <path d="M140,-60 L142,-52 L140,-50 L138,-52 Z" fill="url(#mi-gold-gradient)" opacity="0.7">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="0.9s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      </path>
      <path d="M-130,-120 L-128,-112 L-130,-110 L-132,-112 Z" fill="url(#mi-gold-gradient)" opacity="0.6">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.4;1" dur="2s" begin="1.2s" repeatCount="indefinite"/>
      </path>
      <path d="M130,-120 L132,-112 L130,-110 L128,-112 Z" fill="url(#mi-gold-gradient)" opacity="0.6">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.4;1" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
