<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wpl-upw-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55A2B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wpl-upw-pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:1" />
    </linearGradient>
    <filter id="wpl-upw-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes fly {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(5deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
      }
      .crane { animation: fly 3s ease-in-out infinite; }
      .logo-pulse { animation: pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#wpl-upw-orange-grad)" class="logo-pulse" filter="url(#wpl-upw-glow)"/>
  
  <!-- Sarus Crane -->
  <g class="crane">
    <ellipse cx="100" cy="80" rx="35" ry="20" fill="url(#wpl-upw-pink-grad)" opacity="0.9"/>
    <path d="M 65 80 L 100 50 L 135 80" stroke="url(#wpl-upw-pink-grad)" stroke-width="4" fill="none"/>
    <circle cx="95" cy="75" r="4" fill="#FFF"/>
    <circle cx="105" cy="75" r="4" fill="#FFF"/>
    <!-- Sword -->
    <line x1="100" y1="100" x2="100" y2="130" stroke="url(#wpl-upw-pink-grad)" stroke-width="5" opacity="0.9"/>
  </g>
  
  <!-- UPW Text -->
  <text x="100" y="155" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#FF69B4" text-anchor="middle" opacity="0.95">UPW</text>
</svg>

