<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tbaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333EA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tbaGradientGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Animated background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#tbaGradient)" opacity="0.2">
    <animate attributeName="r" values="95;100;95" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main circle -->
  <circle cx="100" cy="100" r="85" fill="url(#tbaGradient)" stroke="url(#tbaGradientGold)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner decorative ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#tbaGradientGold)" stroke-width="2" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- TBA Text -->
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" filter="url(#glow)">
    TBA
  </text>
  
  <!-- Decorative stars -->
  <g opacity="0.8">
    <circle cx="50" cy="50" r="3" fill="url(#tbaGradientGold)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="150" cy="50" r="3" fill="url(#tbaGradientGold)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="50" cy="150" r="3" fill="url(#tbaGradientGold)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="150" cy="150" r="3" fill="url(#tbaGradientGold)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>
  
  <!-- Pulsing center dot -->
  <circle cx="100" cy="100" r="8" fill="url(#tbaGradientGold)">
    <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>

