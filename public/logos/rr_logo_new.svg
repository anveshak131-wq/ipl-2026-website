<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rr-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA1A85" />
      <stop offset="100%" stop-color="#D11675" />
    </linearGradient>
    <linearGradient id="rr-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004B8D" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
    <filter id="rr-glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#rr-pink)" opacity="0.1"/>
  
  <!-- Main Circle -->
  <circle cx="200" cy="200" r="170" fill="url(#rr-pink)" filter="url(#rr-glow)"/>
  
  <!-- Inner Circle -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#rr-blue)" stroke-width="4"/>
  
  <!-- Crown -->
  <g transform="translate(200, 180)">
    <!-- Crown Base -->
    <path d="M -50 -10 L -30 -35 L -10 -45 L 10 -45 L 30 -35 L 50 -10 L 45 5 L -45 5 Z" 
          fill="url(#rr-blue)"/>
    <!-- Crown Points -->
    <rect x="-45" y="-45" width="15" height="35" fill="url(#rr-blue)"/>
    <rect x="-20" y="-45" width="15" height="40" fill="url(#rr-blue)"/>
    <rect x="5" y="-45" width="15" height="40" fill="url(#rr-blue)"/>
    <rect x="30" y="-45" width="15" height="35" fill="url(#rr-blue)"/>
    <!-- Gems -->
    <circle cx="-20" cy="-25" r="5" fill="url(#rr-pink)"/>
    <circle cx="20" cy="-25" r="5" fill="url(#rr-pink)"/>
  </g>
  
  <!-- RR Text -->
  <text x="200" y="270" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="4">RR</text>
  
  <!-- Decorative Stars -->
  <path d="M 130 130 L 135 140 L 145 140 L 137 147 L 140 157 L 130 150 L 120 157 L 123 147 L 115 140 L 125 140 Z" 
        fill="url(#rr-blue)" opacity="0.8"/>
  <path d="M 270 130 L 275 140 L 285 140 L 277 147 L 280 157 L 270 150 L 260 157 L 263 147 L 255 140 L 265 140 Z" 
        fill="url(#rr-blue)" opacity="0.8"/>
</svg>
