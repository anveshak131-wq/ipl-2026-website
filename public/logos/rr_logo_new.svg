<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rr-royal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F296D" />
    </linearGradient>
    <linearGradient id="rr-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="rr-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </radialGradient>
    <filter id="rr-shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#rr-glow)"/>
  
  <!-- Main Circle -->
  <circle cx="200" cy="200" r="170" fill="url(#rr-royal-grad)" filter="url(#rr-shadow)"/>
  
  <!-- Inner Border -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#rr-gold-grad)" stroke-width="4"/>
  
  <!-- Crown -->
  <g transform="translate(200, 160)">
    <!-- Crown Base -->
    <path d="M -55 -5 L -35 -40 L -15 -50 L 15 -50 L 35 -40 L 55 -5 L 50 8 L -50 8 Z" 
          fill="url(#rr-gold-grad)"/>
    <!-- Crown Points -->
    <rect x="-50" y="-50" width="16" height="40" fill="url(#rr-gold-grad)"/>
    <rect x="-22" y="-50" width="16" height="45" fill="url(#rr-gold-grad)"/>
    <rect x="6" y="-50" width="16" height="45" fill="url(#rr-gold-grad)"/>
    <rect x="34" y="-50" width="16" height="40" fill="url(#rr-gold-grad)"/>
    <!-- Crown Gems -->
    <circle cx="-22" cy="-30" r="6" fill="url(#rr-royal-grad)"/>
    <circle cx="22" cy="-30" r="6" fill="url(#rr-royal-grad)"/>
  </g>
  
  <!-- RR Text -->
  <text x="200" y="270" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="8">RR</text>
  
  <!-- Decorative Stars -->
  <path d="M 130 130 L 137 140 L 147 140 L 140 147 L 143 157 L 130 150 L 117 157 L 120 147 L 113 140 L 123 140 Z" 
        fill="url(#rr-gold-grad)" opacity="0.9"/>
  <path d="M 270 130 L 277 140 L 287 140 L 280 147 L 283 157 L 270 150 L 257 157 L 260 147 L 253 140 L 263 140 Z" 
        fill="url(#rr-gold-grad)" opacity="0.9"/>
</svg>
