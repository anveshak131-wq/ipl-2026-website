<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Green to Teal Gradient -->
    <linearGradient id="upw-green-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669">
        <animate attributeName="stop-color" values="#059669;#10B981;#059669" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#14B8A6">
        <animate attributeName="stop-color" values="#14B8A6;#2DD4BF;#14B8A6" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <!-- Orange Accent -->
    <linearGradient id="upw-orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    
    <!-- Gold for Details -->
    <linearGradient id="upw-gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    
    <!-- Radial Glow -->
    <radialGradient id="upw-glow-gradient" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    
    <!-- Shadow Filter -->
    <filter id="upw-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="4" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Glow Filter -->
    <filter id="upw-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Animated Background Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#upw-glow-gradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#upw-green-gradient)" stroke-width="6" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 200 200;360 200 200" dur="19s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main Logo Group -->
  <g transform="translate(200,200)" filter="url(#upw-shadow)">
    <!-- Shield Base -->
    <path d="M-80,-50 Q0,-70 80,-50 L70,50 Q0,70 -70,50 Z" fill="url(#upw-green-gradient)" filter="url(#upw-glow)" opacity="0.95">
      <animate attributeName="opacity" values="0.95;1;0.95" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Sarus Crane (Detailed) -->
    <g transform="translate(0,-20)">
      <!-- Body -->
      <ellipse cx="0" cy="10" rx="25" ry="18" fill="#FFFFFF" opacity="0.95">
        <animate attributeName="ry" values="18;20;18" dur="2.5s" repeatCount="indefinite"/>
      </ellipse>
      
      <!-- Neck -->
      <path d="M0,10 Q15,-5 20,-15" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.95"/>
      
      <!-- Head -->
      <circle cx="20" cy="-15" r="12" fill="#FFFFFF" opacity="0.95"/>
      
      <!-- Beak -->
      <path d="M28,-15 L38,-12 L28,-9 Z" fill="url(#upw-orange-gradient)" opacity="0.95"/>
      
      <!-- Eye -->
      <circle cx="22" cy="-17" r="3" fill="#1F2937" opacity="0.9">
        <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="23" cy="-16" r="1" fill="#FFFFFF" opacity="0.9"/>
      
      <!-- Legs -->
      <line x1="-10" y1="25" x2="-10" y2="40" stroke="url(#upw-orange-gradient)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
      <line x1="10" y1="25" x2="10" y2="40" stroke="url(#upw-orange-gradient)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
      
      <!-- Wings (Animated Flapping) -->
      <g transform="translate(-15,5)">
        <ellipse cx="0" cy="0" rx="20" ry="25" fill="url(#upw-green-gradient)" opacity="0.8" transform="rotate(-25)">
          <animateTransform attributeName="transform" type="rotate" values="-25 -15 5;15 -15 5;-25 -15 5" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0.95;0.8" dur="2s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <g transform="translate(15,5)">
        <ellipse cx="0" cy="0" rx="20" ry="25" fill="url(#upw-green-gradient)" opacity="0.8" transform="rotate(25)">
          <animateTransform attributeName="transform" type="rotate" values="25 15 5;-15 15 5;25 15 5" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0.95;0.8" dur="2s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      
      <!-- Wing Details -->
      <path d="M-20,8 Q-15,0 -10,8" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.9;0.7" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M20,8 Q15,0 10,8" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.9;0.7" dur="2s" begin="0.1s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Sword (Crossed with Shield) -->
    <g transform="translate(0,10)">
      <!-- Sword Blade -->
      <line x1="0" y1="-30" x2="0" y2="30" stroke="url(#upw-gold-gradient)" stroke-width="5" stroke-linecap="round" opacity="0.95">
        <animate attributeName="opacity" values="0.95;1;0.95" dur="2s" repeatCount="indefinite"/>
      </line>
      
      <!-- Sword Hilt Top -->
      <path d="M-8,-30 L0,-35 L8,-30" fill="url(#upw-gold-gradient)" opacity="0.95"/>
      
      <!-- Sword Guard -->
      <line x1="-12" y1="0" x2="12" y2="0" stroke="url(#upw-gold-gradient)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
      
      <!-- Sword Pommel -->
      <circle cx="0" cy="30" r="6" fill="url(#upw-gold-gradient)" opacity="0.95"/>
    </g>
    
    <!-- UPW Text -->
    <text x="0" y="85" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold" font-family="Arial, sans-serif" opacity="0.95" filter="url(#upw-glow)">UPW</text>
    
    <!-- Decorative Elements -->
    <path d="M-100,-100 L-98,-92 L-100,-90 L-102,-92 Z" fill="url(#upw-orange-gradient)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M100,-100 L102,-92 L100,-90 L98,-92 Z" fill="url(#upw-orange-gradient)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
