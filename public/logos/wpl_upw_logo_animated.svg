<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- UP Warriorz WPL - Green & Orange Warrior Shield -->
  <defs>
    <linearGradient id="upw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="upw-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield Background -->
  <path d="M100 10 L170 40 L170 110 Q170 150 100 190 Q30 150 30 110 L30 40 Z" 
        fill="url(#upw-grad)" stroke="url(#upw-orange)" stroke-width="3"/>
  
  <!-- UPW Letters -->
  <text x="100" y="85" font-family="Arial Black, sans-serif" font-size="44" 
        font-weight="bold" fill="url(#upw-orange)" text-anchor="middle" 
        dominant-baseline="middle">UPW</text>
  
  <!-- Subtitle -->
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="14" 
        font-weight="bold" fill="#F97316" text-anchor="middle">WOMEN</text>
  
  <!-- Sword -->
  <rect x="97" y="135" width="6" height="35" fill="#F97316"/>
  <path d="M92 135 L100 125 L108 135 Z" fill="#F97316"/>
  <rect x="93" y="170" width="14" height="3" fill="#F97316"/>
  <circle cx="100" cy="175" r="4" fill="#F97316"/>
  
  <!-- Wings -->
  <path d="M85 50 Q80 55 75 52 Q70 50 68 48" 
        stroke="#F97316" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M115 50 Q120 55 125 52 Q130 50 132 48" 
        stroke="#F97316" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
