<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rrGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EA1A85;stop-opacity:1">
        <animate attributeName="stop-color" values="#EA1A85;#FF6BB5;#EA1A85" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF6BB5;stop-opacity:1">
        <animate attributeName="stop-color" values="#FF6BB5;#EA1A85;#FF6BB5" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="rrBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004B8D;stop-opacity:1">
        <animate attributeName="stop-color" values="#004B8D;#0066CC;#004B8D" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1">
        <animate attributeName="stop-color" values="#0066CC;#004B8D;#0066CC" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  
  <!-- Background circle with pulse -->
  <circle cx="100" cy="100" r="90" fill="url(#rrGradient)" stroke="url(#rrBlue)" stroke-width="4">
    <animate attributeName="r" values="90;92;90" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner circle with rotation -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#rrBlue)" stroke-width="2" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="15s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Crown element with pulse -->
  <path d="M 100 50 L 120 65 L 135 60 L 130 80 L 140 90 L 120 85 L 100 95 L 80 85 L 60 90 L 70 80 L 65 60 L 80 65 Z" 
        fill="url(#rrBlue)">
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Royal emblem with subtle movement -->
  <path d="M 100 100 L 130 110 L 125 130 L 100 140 L 75 130 L 70 110 Z" 
        fill="url(#rrBlue)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Center detail with pulse -->
  <circle cx="100" cy="115" r="8" fill="#EA1A85">
    <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- RR Text -->
  <text x="100" y="170" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle">
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
    RR
  </text>
</svg>

