<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="miGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004BA0;stop-opacity:1">
        <animate attributeName="stop-color" values="#004BA0;#0066CC;#004BA0" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1">
        <animate attributeName="stop-color" values="#0066CC;#004BA0;#0066CC" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="miGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#004BA0;stop-opacity:0.6">
        <animate attributeName="stop-opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#004BA0;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle with pulse -->
  <circle cx="100" cy="100" r="90" fill="url(#miGradient)" stroke="#FFFFFF" stroke-width="4">
    <animate attributeName="r" values="90;92;90" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner circle with rotation -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Mumbai skyline silhouette with wave animation -->
  <path d="M 30 140 L 40 120 L 50 130 L 60 110 L 70 125 L 80 105 L 90 115 L 100 100 L 110 115 L 120 105 L 130 125 L 140 110 L 150 130 L 160 120 L 170 140 Z" 
        fill="#FFFFFF" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Star elements with twinkle -->
  <path d="M 100 30 L 105 45 L 120 45 L 108 55 L 113 70 L 100 62 L 87 70 L 92 55 L 80 45 L 95 45 Z" 
        fill="#FFFFFF">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 100 50;180 100 50;360 100 50" dur="10s" repeatCount="indefinite"/>
  </path>
  <circle cx="100" cy="100" r="3" fill="#FFFFFF">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- MI Text with glow -->
  <text x="100" y="175" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle">
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
    MI
  </text>
</svg>

