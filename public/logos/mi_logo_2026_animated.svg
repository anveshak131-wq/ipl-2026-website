<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mi-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004BA0;stop-opacity:1">
        <animate attributeName="stop-color" values="#004BA0;#0056C3;#004BA0" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1">
        <animate attributeName="stop-color" values="#003366;#004BA0;#003366" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="mi-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFD700;#FFF700;#FFD700" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1">
        <animate attributeName="stop-color" values="#D4AF37;#FFD700;#D4AF37" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="mi-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur">
        <animate attributeName="stdDeviation" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield -->
  <path d="M 100 20 L 155 40 L 165 100 L 155 160 L 100 180 L 45 160 L 35 100 L 45 40 Z" 
        fill="url(#mi-blue)" 
        stroke="url(#mi-gold)" 
        stroke-width="3" 
        filter="url(#mi-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- MI Text -->
  <text x="100" y="110" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" 
        text-anchor="middle" fill="#FFFFFF" filter="url(#mi-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="3s" repeatCount="indefinite"/>
    MI
  </text>
  
  <!-- Decorative stars -->
  <g fill="url(#mi-gold)" opacity="0.8">
    <path d="M 100 50 L 102 58 L 110 58 L 103 63 L 105 71 L 100 66 L 95 71 L 97 63 L 90 58 L 98 58 Z">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
