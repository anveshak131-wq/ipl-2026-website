<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lsg-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lsg-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <filter id="lsg-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes fly {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(5deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
      }
      .eagle { animation: fly 3s ease-in-out infinite; }
      .logo-pulse { animation: pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#lsg-blue-grad)" class="logo-pulse" filter="url(#lsg-glow)"/>
  
  <!-- Eagle -->
  <g class="eagle">
    <ellipse cx="100" cy="85" rx="40" ry="25" fill="url(#lsg-green-grad)" opacity="0.9"/>
    <path d="M 60 85 L 100 60 L 140 85" stroke="url(#lsg-green-grad)" stroke-width="4" fill="none"/>
    <circle cx="95" cy="80" r="4" fill="#FFF"/>
    <circle cx="105" cy="80" r="4" fill="#FFF"/>
  </g>
  
  <!-- LSG Text -->
  <text x="100" y="150" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#4CAF50" text-anchor="middle" opacity="0.95">LSG</text>
</svg>

