<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SportsUP99 Logo</title>
  <desc id="desc">Bold dynamic cricket-themed logo with cricket ball centerpiece and vibrant colors.</desc>

  <!-- Dynamic energy background - hexagon shape -->
  <g transform="translate(100, 100)">
    <!-- Outer hexagon with gradient -->
    <polygon
      points="-70,-60 70,-60 100,0 70,60 -70,60 -100,0"
      fill="url(#new-bg-gradient)"
      stroke="url(#new-border-gradient)"
      stroke-width="3"
    />
    
    <!-- Inner hexagon accent -->
    <polygon
      points="-55,-45 55,-45 75,0 55,45 -55,45 -75,0"
      fill="none"
      stroke="url(#new-inner-accent)"
      stroke-width="2"
      opacity="0.6"
    />
  </g>

  <!-- Cricket ball - centerpiece -->
  <g transform="translate(100, 100)">
    <!-- Ball shadow/glow -->
    <circle
      cx="0"
      cy="0"
      r="32"
      fill="url(#ball-glow)"
      opacity="0.4"
    />
    
    <!-- Main cricket ball -->
    <circle
      cx="0"
      cy="0"
      r="28"
      fill="url(#ball-gradient)"
      stroke="url(#ball-stroke)"
      stroke-width="2"
    />
    
    <!-- Cricket ball seam - top curve -->
    <path
      d="M -20 -8 Q 0 -12 20 -8"
      stroke="url(#seam-gradient)"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
    />
    
    <!-- Cricket ball seam - bottom curve -->
    <path
      d="M -20 8 Q 0 12 20 8"
      stroke="url(#seam-gradient)"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
    />
    
    <!-- Cricket ball seam - vertical -->
    <path
      d="M 0 -20 Q 8 0 0 20"
      stroke="url(#seam-gradient)"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- Dynamic energy lines - top -->
  <g transform="translate(100, 100)">
    <line x1="0" y1="-85" x2="0" y2="-75" stroke="url(#energy-gradient)" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="75" x2="0" y2="85" stroke="url(#energy-gradient)" stroke-width="4" stroke-linecap="round" />
    <line x1="-85" y1="0" x2="-75" y2="0" stroke="url(#energy-gradient)" stroke-width="4" stroke-linecap="round" />
    <line x1="75" y1="0" x2="85" y2="0" stroke="url(#energy-gradient)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Diagonal energy lines -->
  <g transform="translate(100, 100)">
    <line x1="-60" y1="-60" x2="-50" y2="-50" stroke="url(#energy-gradient-2)" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="-50" x2="60" y2="-60" stroke="url(#energy-gradient-2)" stroke-width="3" stroke-linecap="round" />
    <line x1="-60" y1="60" x2="-50" y2="50" stroke="url(#energy-gradient-2)" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="50" x2="60" y2="60" stroke="url(#energy-gradient-2)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Accent sparks -->
  <g opacity="0.9">
    <circle cx="100" cy="30" r="3" fill="#00FFFF" />
    <circle cx="170" cy="100" r="2.5" fill="#FF3366" />
    <circle cx="100" cy="170" r="3" fill="#00FFFF" />
    <circle cx="30" cy="100" r="2.5" fill="#FF3366" />
  </g>

  <defs>
    <!-- Background gradient - dark with vibrant edges -->
    <radialGradient id="new-bg-gradient" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0A0E27" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </radialGradient>

    <!-- Border gradient - electric colors -->
    <linearGradient id="new-border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="25%" stop-color="#00FFFF" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="75%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Inner accent -->
    <linearGradient id="new-inner-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.6" />
    </linearGradient>

    <!-- Cricket ball gradient -->
    <radialGradient id="ball-gradient" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1A1A2E" />
      <stop offset="40%" stop-color="#16213E" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Ball glow -->
    <radialGradient id="ball-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0.2" />
    </radialGradient>

    <!-- Ball stroke -->
    <linearGradient id="ball-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>

    <!-- Seam gradient -->
    <linearGradient id="seam-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>

    <!-- Energy lines gradient -->
    <linearGradient id="energy-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00FFFF" />
    </linearGradient>

    <!-- Energy lines gradient 2 -->
    <linearGradient id="energy-gradient-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>
  </defs>
</svg>

