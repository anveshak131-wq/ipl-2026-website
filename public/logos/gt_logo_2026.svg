<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2130;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A3441;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gtRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E15454;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="url(#gtGradient)" stroke="url(#gtRed)" stroke-width="4"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#gtRed)" stroke-width="2" opacity="0.5"/>
  
  <!-- Titan/Giant silhouette -->
  <path d="M 100 50 L 130 70 L 140 100 L 130 130 L 100 150 L 70 130 L 60 100 L 70 70 Z" 
        fill="url(#gtRed)"/>
  
  <!-- Shoulder details -->
  <path d="M 70 70 L 85 80 L 80 90 L 70 85 Z" fill="#1B2130"/>
  <path d="M 130 70 L 115 80 L 120 90 L 130 85 Z" fill="#1B2130"/>
  
  <!-- Head detail -->
  <circle cx="100" cy="75" r="12" fill="#1B2130"/>
  
  <!-- GT Text -->
  <text x="100" y="175" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
        fill="url(#gtRed)" text-anchor="middle">GT</text>
</svg>

