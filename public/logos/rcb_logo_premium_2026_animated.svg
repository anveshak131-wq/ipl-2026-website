<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- RCB Premium Logo - Elegant Lion King -->
  <defs>
    <linearGradient id="rcb-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C0392B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A93226;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rcb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4D03F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="rcb-shine" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Main Shield -->
  <path d="M100 15 L175 45 L175 115 Q175 155 100 185 Q25 155 25 115 L25 45 Z" 
        fill="url(#rcb-red)" stroke="url(#rcb-gold)" stroke-width="4"/>
  
  <!-- Inner Highlight -->
  <path d="M100 25 L160 50 L160 110 Q160 145 100 170 Q40 145 40 110 L40 50 Z" 
        fill="url(#rcb-shine)" opacity="0.3"/>
  
  <!-- Stylized Lion Head -->
  <g transform="translate(100, 80)">
    <!-- Mane - Elegant Crown Shape -->
    <g fill="url(#rcb-gold)">
      <circle cx="-25" cy="-15" r="8" opacity="0.9"/>
      <circle cx="-15" cy="-22" r="9" opacity="0.95"/>
      <circle cx="0" cy="-25" r="10"/>
      <circle cx="15" cy="-22" r="9" opacity="0.95"/>
      <circle cx="25" cy="-15" r="8" opacity="0.9"/>
      <ellipse cx="-20" cy="-5" rx="7" ry="10" opacity="0.85"/>
      <ellipse cx="20" cy="-5" rx="7" ry="10" opacity="0.85"/>
    </g>
    
    <!-- Face Circle -->
    <circle cx="0" cy="0" r="30" fill="#D4A574"/>
    <circle cx="0" cy="0" r="28" fill="#CD9B5B"/>
    
    <!-- Eyes - Confident Look -->
    <ellipse cx="-9" cy="-5" rx="4" ry="5" fill="#2C3E50"/>
    <ellipse cx="9" cy="-5" rx="4" ry="5" fill="#2C3E50"/>
    <circle cx="-8" cy="-6" r="1.5" fill="#FFFFFF"/>
    <circle cx="10" cy="-6" r="1.5" fill="#FFFFFF"/>
    
    <!-- Nose -->
    <ellipse cx="0" cy="5" rx="4" ry="3" fill="#8B6F47"/>
    
    <!-- Confident Smile -->
    <path d="M-10,12 Q0,18 10,12" stroke="#2C3E50" stroke-width="2" 
          fill="none" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Whisker Dots -->
    <circle cx="-20" cy="5" r="1.5" fill="#8B6F47" opacity="0.6"/>
    <circle cx="-22" cy="0" r="1.5" fill="#8B6F47" opacity="0.6"/>
    <circle cx="20" cy="5" r="1.5" fill="#8B6F47" opacity="0.6"/>
    <circle cx="22" cy="0" r="1.5" fill="#8B6F47" opacity="0.6"/>
  </g>
  
  <!-- RCB Text with Bold Style -->
  <text x="100" y="145" font-family="Arial Black, sans-serif" font-size="40" 
        font-weight="900" fill="url(#rcb-gold)" text-anchor="middle" 
        stroke="#8B0000" stroke-width="1.5">RCB</text>
  
  <!-- Subtitle -->
  <text x="100" y="168" font-family="Arial, sans-serif" font-size="11" 
        font-weight="bold" fill="#F4D03F" text-anchor="middle" opacity="0.95">ROYAL CHALLENGERS</text>
  
  <!-- Crown on Shield Top -->
  <g transform="translate(100, 22)">
    <path d="M-15,0 L-10,-8 L-5,0 L0,-10 L5,0 L10,-8 L15,0 L12,5 L-12,5 Z" 
          fill="url(#rcb-gold)" stroke="#8B0000" stroke-width="1"/>
    <circle cx="-10" cy="-8" r="2" fill="#E74C3C"/>
    <circle cx="0" cy="-10" r="2.5" fill="#E74C3C"/>
    <circle cx="10" cy="-8" r="2" fill="#E74C3C"/>
  </g>
  
  <!-- Decorative Golden Accents -->
  <circle cx="35" cy="70" r="3" fill="url(#rcb-gold)" opacity="0.8"/>
  <circle cx="165" cy="70" r="3" fill="url(#rcb-gold)" opacity="0.8"/>
  <path d="M30,100 L35,105 L30,110" stroke="url(#rcb-gold)" stroke-width="2" 
        fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M170,100 L165,105 L170,110" stroke="url(#rcb-gold)" stroke-width="2" 
        fill="none" opacity="0.7" stroke-linecap="round"/>
</svg>
