<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium gradient for RCB -->
    <linearGradient id="rcbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC1C24;stop-opacity:1">
        <animate attributeName="stop-color" values="#EC1C24;#FF6B6B;#EC1C24" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FF6B6B;stop-opacity:1">
        <animate attributeName="stop-color" values="#FF6B6B;#EC1C24;#FF6B6B" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#EC1C24;stop-opacity:1">
        <animate attributeName="stop-color" values="#EC1C24;#FF6B6B;#EC1C24" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="rcbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFD700;#FFA500;#FFD700" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFA500;#FFD700;#FFA500" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="rcbGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#EC1C24;stop-opacity:0.8">
        <animate attributeName="stop-opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#EC1C24;stop-opacity:0">
        <animate attributeName="stop-opacity" values="0;0.2;0" dur="2s" repeatCount="indefinite"/>
      </stop>
    </radialGradient>
    <!-- Animated glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur">
        <animate attributeName="stdDeviation" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow with pulse animation -->
  <circle cx="100" cy="100" r="95" fill="url(#rcbGlow)" opacity="0.6">
    <animate attributeName="r" values="95;100;95" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main shield shape with premium design -->
  <path d="M 100 20 L 160 40 L 180 100 L 160 160 L 100 180 L 40 160 L 20 100 L 40 40 Z" 
        fill="url(#rcbGradient)" 
        stroke="url(#rcbGold)" 
        stroke-width="3"
        filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;2 100 100;0 100 100;-2 100 100;0 100 100" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Inner shield detail with rotation -->
  <path d="M 100 35 L 145 50 L 160 100 L 145 150 L 100 165 L 55 150 L 40 100 L 55 50 Z" 
        fill="none" 
        stroke="url(#rcbGold)" 
        stroke-width="2" 
        opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;-1 100 100;0 100 100;1 100 100;0 100 100" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Crown/Star element at top with pulse -->
  <path d="M 100 30 L 110 50 L 130 45 L 115 60 L 120 80 L 100 70 L 80 80 L 85 60 L 70 45 L 90 50 Z" 
        fill="url(#rcbGold)" 
        filter="url(#glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- RCB Text with premium styling and glow -->
  <text x="100" y="120" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" 
        fill="url(#rcbGold)" text-anchor="middle" 
        stroke="#000" stroke-width="1" opacity="0.3">RCB</text>
  <text x="100" y="120" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" 
        fill="url(#rcbGold)" text-anchor="middle">
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
    RCB
  </text>
  
  <!-- Lion silhouette (simplified) with subtle animation -->
  <path d="M 70 140 Q 60 130 70 120 Q 80 115 90 120 Q 100 115 110 120 Q 120 115 130 120 Q 140 130 130 140 L 125 150 Q 120 155 100 155 Q 80 155 75 150 Z" 
        fill="#000" 
        opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0;2,0;0,0" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Decorative elements with twinkle animation -->
  <circle cx="100" cy="100" r="2" fill="url(#rcbGold)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3;2" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="80" r="1.5" fill="url(#rcbGold)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="140" cy="80" r="1.5" fill="url(#rcbGold)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="60" cy="120" r="1.5" fill="url(#rcbGold)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
  </circle>
  <circle cx="140" cy="120" r="1.5" fill="url(#rcbGold)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
</svg>

