<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rcb-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8102E;stop-opacity:1">
        <animate attributeName="stop-color" values="#C8102E;#D91E3A;#C8102E" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#8B1A1A;stop-opacity:1">
        <animate attributeName="stop-color" values="#8B1A1A;#C8102E;#8B1A1A" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="rcb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFD700;#FFA500;#FFD700" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFA500;#FFD700;#FFA500" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur">
        <animate attributeName="stdDeviation" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield -->
  <path d="M 100 20 L 155 40 L 165 100 L 155 160 L 100 180 L 45 160 L 35 100 L 45 40 Z" 
        fill="url(#rcb-red)" 
        stroke="url(#rcb-gold)" 
        stroke-width="4" 
        filter="url(#glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Inner border -->
  <path d="M 100 35 L 140 50 L 145 100 L 140 150 L 100 165 L 60 150 L 55 100 L 60 50 Z" 
        fill="none" 
        stroke="url(#rcb-gold)" 
        stroke-width="2" 
        opacity="0.6"/>
  
  <!-- Crown -->
  <path d="M 100 30 L 110 45 L 125 40 L 115 55 L 130 65 L 100 55 L 70 65 L 85 55 L 75 40 L 90 45 Z" 
        fill="url(#rcb-gold)" 
        filter="url(#glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Lion head - simple and clean -->
  <g transform="translate(100, 105)">
    <!-- Mane -->
    <circle cx="0" cy="-8" r="32" fill="url(#rcb-gold)" opacity="0.95"/>
    
    <!-- Face -->
    <ellipse cx="0" cy="0" rx="24" ry="28" fill="#000" opacity="0.95"/>
    
    <!-- Eyes -->
    <circle cx="-9" cy="-5" r="4" fill="#C8102E">
      <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-9" cy="-5" r="2" fill="#000"/>
    <circle cx="9" cy="-5" r="4" fill="#C8102E">
      <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="9" cy="-5" r="2" fill="#000"/>
    
    <!-- Nose -->
    <ellipse cx="0" cy="8" rx="3" ry="2.5" fill="#000"/>
    <path d="M -2 8 Q 0 13 2 8" fill="none" stroke="url(#rcb-gold)" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Mouth -->
    <path d="M -8 13 Q 0 17 8 13" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- RCB text -->
  <text x="100" y="165" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
        fill="url(#rcb-gold)" text-anchor="middle" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.9;1" dur="2s" repeatCount="indefinite"/>
    RCB
  </text>
</svg>
