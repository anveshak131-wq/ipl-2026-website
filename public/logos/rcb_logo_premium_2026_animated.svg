<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- RCB Premium Logo - Elegant Lion King -->
  <defs>
    <linearGradient id="rcb-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C0392B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A93226;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rcb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4D03F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="rcb-shine" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Main Shield -->
  <path d="M100 12 L172 40 L172 116 Q172 156 100 188 Q28 156 28 116 L28 40 Z" 
        fill="url(#rcb-red)" stroke="url(#rcb-gold)" stroke-width="6"/>
  
  <!-- Inner Highlight -->
  <path d="M100 28 L156 50 L156 112 Q156 142 100 166 Q44 142 44 112 L44 50 Z" 
        fill="url(#rcb-shine)" opacity="0.35"/>
  
  <!-- Stylized Lion Head -->
  <g transform="translate(100, 86)">
    <!-- Mane - Elegant Crown Shape -->
    <path d="M0 -34 C-18 -34 -34 -18 -34 0 C-34 18 -18 34 0 34 C18 34 34 18 34 0 C34 -18 18 -34 0 -34 Z" fill="url(#rcb-gold)" opacity="0.95"/>
    <path d="M0 -26 C-14 -26 -26 -14 -26 0 C-26 14 -14 26 0 26 C14 26 26 14 26 0 C26 -14 14 -26 0 -26 Z" fill="#120606" opacity="0.92"/>

    <!-- Face Circle -->
    <path d="M-15 4 Q0 -16 15 4 Q0 18 -15 4 Z" fill="url(#rcb-red)" opacity="0.9"/>

    <!-- Eyes - Confident Look -->
    <path d="M-14 -4 Q-8 -10 -2 -4" stroke="url(#rcb-gold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M2 -4 Q8 -10 14 -4" stroke="url(#rcb-gold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M0 2 L-3 7 L0 10 L3 7 Z" fill="url(#rcb-gold)" opacity="0.9"/>

    <!-- Confident Smile -->
    <path d="M-12,14 Q0,22 12,14" stroke="url(#rcb-gold)" stroke-width="2.5" 
          fill="none" stroke-linecap="round" opacity="0.95"/>

    <!-- Whisker Dots -->
    <path d="M-18 6 L-28 6" stroke="url(#rcb-gold)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <path d="M18 6 L28 6" stroke="url(#rcb-gold)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  </g>
  
  <!-- RCB Text with Bold Style -->
  <text x="100" y="148" font-family="Arial Black, sans-serif" font-size="44" 
        font-weight="900" fill="url(#rcb-gold)" text-anchor="middle" 
        stroke="#5A0A0A" stroke-width="2">RCB</text>
  
  <!-- Subtitle -->
  <text x="100" y="172" font-family="Arial, sans-serif" font-size="11" 
        font-weight="bold" fill="#F4D03F" text-anchor="middle" opacity="0.95">BENGALURU</text>
  
  <!-- Crown on Shield Top -->
  <g transform="translate(100, 22)">
    <path d="M-18,4 L-12,-10 L-6,2 L0,-14 L6,2 L12,-10 L18,4 L14,10 L-14,10 Z" 
          fill="url(#rcb-gold)" stroke="#5A0A0A" stroke-width="1.2"/>
    <circle cx="-12" cy="-10" r="2.2" fill="#E74C3C"/>
    <circle cx="0" cy="-14" r="2.6" fill="#E74C3C"/>
    <circle cx="12" cy="-10" r="2.2" fill="#E74C3C"/>
  </g>
  
  <!-- Decorative Golden Accents -->
  <path d="M38 78 Q50 70 62 78" stroke="url(#rcb-gold)" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M162 78 Q150 70 138 78" stroke="url(#rcb-gold)" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
  <circle cx="52" cy="82" r="2.5" fill="url(#rcb-gold)" opacity="0.75"/>
  <circle cx="148" cy="82" r="2.5" fill="url(#rcb-gold)" opacity="0.75"/>
</svg>
