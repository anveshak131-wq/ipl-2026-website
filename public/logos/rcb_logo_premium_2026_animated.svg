<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rcb-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8102E;stop-opacity:1">
        <animate attributeName="stop-color" values="#C8102E;#D91E3A;#C8102E" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#8B1A1A;stop-opacity:1">
        <animate attributeName="stop-color" values="#8B1A1A;#C8102E;#8B1A1A" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <!-- Muted gold - less bright -->
    <linearGradient id="rcb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1">
        <animate attributeName="stop-color" values="#D4AF37;#B8860B;#D4AF37" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1">
        <animate attributeName="stop-color" values="#B8860B;#D4AF37;#B8860B" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur">
        <animate attributeName="stdDeviation" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield -->
  <path d="M 100 20 L 155 40 L 165 100 L 155 160 L 100 180 L 45 160 L 35 100 L 45 40 Z" 
        fill="url(#rcb-red)" 
        stroke="url(#rcb-gold)" 
        stroke-width="4" 
        filter="url(#glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Inner border -->
  <path d="M 100 35 L 140 50 L 145 100 L 140 150 L 100 165 L 60 150 L 55 100 L 60 50 Z" 
        fill="none" 
        stroke="url(#rcb-gold)" 
        stroke-width="2" 
        opacity="0.6"/>
  
  <!-- Crown -->
  <path d="M 100 30 L 110 45 L 125 40 L 115 55 L 130 65 L 100 55 L 70 65 L 85 55 L 75 40 L 90 45 Z" 
        fill="url(#rcb-gold)" 
        filter="url(#glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Lion head - improved design -->
  <g transform="translate(100, 105)">
    <!-- Mane - fuller and more natural -->
    <ellipse cx="0" cy="-10" rx="35" ry="30" fill="url(#rcb-gold)" opacity="0.95"/>
    <ellipse cx="0" cy="-10" rx="32" ry="27" fill="none" stroke="#8B6914" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Face - better proportions -->
    <ellipse cx="0" cy="2" rx="26" ry="30" fill="#1a1a1a" opacity="0.98"/>
    <ellipse cx="0" cy="2" rx="23" ry="27" fill="#2a2a2a" opacity="0.3"/>
    
    <!-- Eyes - more expressive -->
    <ellipse cx="-10" cy="-3" rx="5" ry="6" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="-10" cy="-3" r="3.5" fill="#C8102E">
      <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-10" cy="-3" r="2" fill="#000"/>
    <circle cx="-10" cy="-3" r="0.8" fill="#FFF"/>
    
    <ellipse cx="10" cy="-3" rx="5" ry="6" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="10" cy="-3" r="3.5" fill="#C8102E">
      <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="10" cy="-3" r="2" fill="#000"/>
    <circle cx="10" cy="-3" r="0.8" fill="#FFF"/>
    
    <!-- Eyebrows -->
    <path d="M -16 -8 Q -10 -9 -10 -5" fill="none" stroke="url(#rcb-gold)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 16 -8 Q 10 -9 10 -5" fill="none" stroke="url(#rcb-gold)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Nose - better shape -->
    <ellipse cx="0" cy="10" rx="4" ry="3" fill="#000" opacity="0.9"/>
    <path d="M -2.5 10 Q 0 16 2.5 10" fill="none" stroke="url(#rcb-gold)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Mouth - more natural -->
    <path d="M -10 18 Q 0 22 10 18 Q 8 28 0 25 Q -8 28 -10 18 Z" 
          fill="#C8102E" opacity="0.95"/>
    <path d="M -8 20 Q 0 23 8 20" fill="none" stroke="url(#rcb-gold)" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Teeth -->
    <path d="M -3.5 20 L -2 25 L -5 25 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 3.5 20 L 2 25 L 5 25 Z" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Whiskers -->
    <g stroke="url(#rcb-gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
      <line x1="-14" y1="6" x2="-20" y2="5"/>
      <line x1="-14" y1="10" x2="-20" y2="10"/>
      <line x1="-14" y1="14" x2="-20" y2="15"/>
      <line x1="14" y1="6" x2="20" y2="5"/>
      <line x1="14" y1="10" x2="20" y2="10"/>
      <line x1="14" y1="14" x2="20" y2="15"/>
    </g>
  </g>
  
  <!-- RCB text -->
  <text x="100" y="165" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
        fill="url(#rcb-gold)" text-anchor="middle" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.9;1" dur="2s" repeatCount="indefinite"/>
    RCB
  </text>
</svg>
