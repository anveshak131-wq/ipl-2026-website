<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pbks-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ED1D24;stop-opacity:1">
        <animate attributeName="stop-color" values="#ED1D24;#FD2D34;#ED1D24" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#CC0D14;stop-opacity:1">
        <animate attributeName="stop-color" values="#CC0D14;#ED1D24;#CC0D14" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="pbks-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBDD0B;stop-opacity:1">
        <animate attributeName="stop-color" values="#FBDD0B;#FFED1B;#FBDD0B" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#DBCD0B;stop-opacity:1">
        <animate attributeName="stop-color" values="#DBCD0B;#FBDD0B;#DBCD0B" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="pbks-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur">
        <animate attributeName="stdDeviation" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield -->
  <path d="M 100 20 L 155 40 L 165 100 L 155 160 L 100 180 L 45 160 L 35 100 L 45 40 Z" 
        fill="url(#pbks-red)" 
        stroke="url(#pbks-yellow)" 
        stroke-width="3" 
        filter="url(#pbks-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- PBKS Text -->
  <text x="100" y="110" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" 
        text-anchor="middle" fill="url(#pbks-yellow)" filter="url(#pbks-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="3s" repeatCount="indefinite"/>
    PBKS
  </text>
</svg>
