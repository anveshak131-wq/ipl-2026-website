<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gt-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2130" />
      <stop offset="100%" stop-color="#0F1419" />
    </linearGradient>
    <linearGradient id="gt-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E15454" />
      <stop offset="100%" stop-color="#C43E3E" />
    </linearGradient>
    <filter id="gt-glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark Background -->
  <rect width="400" height="400" fill="url(#gt-dark-grad)"/>
  
  <!-- Hexagon Frame -->
  <path d="M 200 50 L 290 100 L 320 190 L 290 280 L 200 330 L 110 280 L 80 190 L 110 100 Z" 
        fill="url(#gt-red-grad)" filter="url(#gt-glow)" opacity="0.85"/>
  
  <!-- Inner Hexagon -->
  <path d="M 200 80 L 270 120 L 290 190 L 270 260 L 200 300 L 130 260 L 110 190 L 130 120 Z" 
        fill="none" stroke="url(#gt-dark-grad)" stroke-width="5"/>
  
  <!-- GT Shield -->
  <g transform="translate(200, 200)">
    <!-- Shield Shape -->
    <path d="M -55 -35 L -35 -55 L 35 -55 L 55 -35 L 55 25 L 35 45 L -35 45 L -55 25 Z" 
          fill="url(#gt-dark-grad)"/>
    <!-- GT Text -->
    <text x="0" y="8" font-family="Arial Black, sans-serif" font-size="40" font-weight="900" 
          fill="url(#gt-red-grad)" text-anchor="middle" letter-spacing="5">GT</text>
  </g>
  
  <!-- Corner Lines -->
  <line x1="120" y1="120" x2="160" y2="160" stroke="url(#gt-red-grad)" stroke-width="2.5" opacity="0.5"/>
  <line x1="280" y1="120" x2="240" y2="160" stroke="url(#gt-red-grad)" stroke-width="2.5" opacity="0.5"/>
  <line x1="120" y1="280" x2="160" y2="240" stroke="url(#gt-red-grad)" stroke-width="2.5" opacity="0.5"/>
  <line x1="280" y1="280" x2="240" y2="240" stroke="url(#gt-red-grad)" stroke-width="2.5" opacity="0.5"/>
</svg>
