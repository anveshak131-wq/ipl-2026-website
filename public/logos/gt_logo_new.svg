<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gt-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2130" />
      <stop offset="100%" stop-color="#0F1419" />
    </linearGradient>
    <linearGradient id="gt-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E15454" />
      <stop offset="100%" stop-color="#C43E3E" />
    </linearGradient>
    <filter id="gt-glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#gt-dark)"/>
  
  <!-- Hexagon Shape -->
  <path d="M 200 60 L 280 100 L 320 180 L 320 260 L 280 340 L 200 380 L 120 340 L 80 260 L 80 180 L 120 100 Z" 
        fill="url(#gt-red)" filter="url(#gt-glow)" opacity="0.9"/>
  
  <!-- Inner Hexagon -->
  <path d="M 200 90 L 260 120 L 290 180 L 290 240 L 260 300 L 200 330 L 140 300 L 110 240 L 110 180 L 140 120 Z" 
        fill="none" stroke="url(#gt-dark)" stroke-width="4"/>
  
  <!-- Titan Shield -->
  <g transform="translate(200, 200)">
    <!-- Shield Shape -->
    <path d="M -50 -30 L -30 -50 L 30 -50 L 50 -30 L 50 20 L 30 40 L -30 40 L -50 20 Z" 
          fill="url(#gt-dark)"/>
    <!-- GT Text -->
    <text x="0" y="10" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" 
          fill="url(#gt-red)" text-anchor="middle" letter-spacing="4">GT</text>
  </g>
  
  <!-- Decorative Lines -->
  <line x1="120" y1="120" x2="160" y2="160" stroke="url(#gt-red)" stroke-width="2" opacity="0.6"/>
  <line x1="280" y1="120" x2="240" y2="160" stroke="url(#gt-red)" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="280" x2="160" y2="240" stroke="url(#gt-red)" stroke-width="2" opacity="0.6"/>
  <line x1="280" y1="280" x2="240" y2="240" stroke="url(#gt-red)" stroke-width="2" opacity="0.6"/>
</svg>
