<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Delhi Capitals WPL - Blue & Red -->
  <defs>
    <linearGradient id="dc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004BA0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dc-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield Background -->
  <path d="M100 10 L170 40 L170 110 Q170 150 100 190 Q30 150 30 110 L30 40 Z" 
        fill="url(#dc-grad)" stroke="url(#dc-red)" stroke-width="3"/>
  
  <!-- DC Letters -->
  <text x="100" y="95" font-family="Arial Black, sans-serif" font-size="56" 
        font-weight="bold" fill="#FFFFFF" text-anchor="middle" 
        dominant-baseline="middle">DC</text>
  
  <!-- Subtitle -->
  <text x="100" y="135" font-family="Arial, sans-serif" font-size="14" 
        font-weight="bold" fill="#DC2626" text-anchor="middle">WOMEN</text>
  
  <!-- Capitol Dome -->
  <circle cx="100" cy="50" r="12" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <rect x="88" y="48" width="24" height="4" fill="#DC2626"/>
  
  <!-- Three Stars (representing three tigers) -->
  <polygon points="60,160 62,166 68,166 63,170 65,176 60,172 55,176 57,170 52,166 58,166" fill="#DC2626"/>
  <polygon points="100,160 102,166 108,166 103,170 105,176 100,172 95,176 97,170 92,166 98,166" fill="#DC2626"/>
  <polygon points="140,160 142,166 148,166 143,170 145,176 140,172 135,176 137,170 132,166 138,166" fill="#DC2626"/>
</svg>
