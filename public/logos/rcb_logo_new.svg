<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rcb-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC1C24" />
      <stop offset="50%" stop-color="#D91E3A" />
      <stop offset="100%" stop-color="#C8102E" />
    </linearGradient>
    <linearGradient id="rcb-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <radialGradient id="rcb-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#EC1C24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#EC1C24" stop-opacity="0" />
    </radialGradient>
    <filter id="rcb-shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#rcb-glow)"/>
  
  <!-- Main Circle -->
  <circle cx="200" cy="200" r="170" fill="url(#rcb-red-grad)" filter="url(#rcb-shadow)"/>
  
  <!-- Inner Border -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#rcb-gold-grad)" stroke-width="3"/>
  
  <!-- RCB Text with Modern Typography -->
  <g transform="translate(200, 200)">
    <text x="0" y="-20" font-family="Arial Black, sans-serif" font-size="56" font-weight="900" 
          fill="url(#rcb-gold-grad)" text-anchor="middle" letter-spacing="6">RCB</text>
    
    <!-- Decorative Line -->
    <line x1="-60" y1="0" x2="60" y2="0" stroke="url(#rcb-gold-grad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Star Elements -->
    <path d="M -50 -40 L -45 -30 L -35 -30 L -42 -22 L -40 -12 L -50 -18 L -60 -12 L -58 -22 L -65 -30 L -55 -30 Z" 
          fill="url(#rcb-gold-grad)" opacity="0.8"/>
    <path d="M 50 -40 L 55 -30 L 65 -30 L 58 -22 L 60 -12 L 50 -18 L 40 -12 L 42 -22 L 35 -30 L 45 -30 Z" 
          fill="url(#rcb-gold-grad)" opacity="0.8"/>
  </g>
  
  <!-- Corner Accents -->
  <circle cx="120" cy="120" r="8" fill="url(#rcb-gold-grad)" opacity="0.7"/>
  <circle cx="280" cy="120" r="8" fill="url(#rcb-gold-grad)" opacity="0.7"/>
  <circle cx="120" cy="280" r="8" fill="url(#rcb-gold-grad)" opacity="0.7"/>
  <circle cx="280" cy="280" r="8" fill="url(#rcb-gold-grad)" opacity="0.7"/>
</svg>
