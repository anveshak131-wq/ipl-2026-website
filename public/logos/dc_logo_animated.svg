<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes dcSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blueRedGlow {
        0%, 100% { filter: drop-shadow(0 0 15px #0078BC); }
        50% { filter: drop-shadow(0 0 25px #0078BC) drop-shadow(0 0 30px #EF1B26); }
      }
      @keyframes dcPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.9; }
      }
      @keyframes capitolShine {
        0% { fill-opacity: 0.9; }
        50% { fill-opacity: 1; }
        100% { fill-opacity: 0.9; }
      }
      .dc-bg { animation: dcPulse 2s ease-in-out infinite; }
      .dc-glow { animation: blueRedGlow 2s ease-in-out infinite; }
      .dc-rotate { animation: dcSpin 15s linear infinite; transform-origin: 100px 100px; }
      .capitol { animation: capitolShine 2s ease-in-out infinite; }
    </style>
    <linearGradient id="dcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078BC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005A8B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="40" fill="url(#dcGradient)" class="dc-bg dc-glow"/>
  
  <rect x="80" y="80" width="40" height="50" fill="#EF1B26" class="capitol"/>
  <polygon points="100,60 120,80 80,80" fill="#EF1B26" class="capitol"/>
  <circle cx="100" cy="100" r="15" fill="#FFFFFF" opacity="0.3"/>
  
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#fff">DC</text>
</svg>

