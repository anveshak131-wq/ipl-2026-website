<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dc-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078BC;stop-opacity:1">
        <animate attributeName="stop-color" values="#0078BC;#0088CC;#0078BC" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#005A8C;stop-opacity:1">
        <animate attributeName="stop-color" values="#005A8C;#0078BC;#005A8C" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="dc-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF1B26;stop-opacity:1">
        <animate attributeName="stop-color" values="#EF1B26;#FF2B36;#EF1B26" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#CC0A15;stop-opacity:1">
        <animate attributeName="stop-color" values="#CC0A15;#EF1B26;#CC0A15" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="dc-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur">
        <animate attributeName="stdDeviation" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield -->
  <path d="M 100 20 L 155 40 L 165 100 L 155 160 L 100 180 L 45 160 L 35 100 L 45 40 Z" 
        fill="url(#dc-blue)" 
        stroke="url(#dc-red)" 
        stroke-width="3" 
        filter="url(#dc-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- DC Text -->
  <text x="100" y="110" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
        text-anchor="middle" fill="#FFFFFF" filter="url(#dc-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="3s" repeatCount="indefinite"/>
    DC
  </text>
</svg>
