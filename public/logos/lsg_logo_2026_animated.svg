<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lsgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C2A2C;stop-opacity:1">
        <animate attributeName="stop-color" values="#9C2A2C;#C0392B;#9C2A2C" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1">
        <animate attributeName="stop-color" values="#C0392B;#9C2A2C;#C0392B" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="lsgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7E17D;stop-opacity:1">
        <animate attributeName="stop-color" values="#F7E17D;#FFD700;#F7E17D" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFD700;#F7E17D;#FFD700" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  
  <!-- Background with pulse -->
  <circle cx="100" cy="100" r="90" fill="url(#lsgGradient)" stroke="url(#lsgGold)" stroke-width="4">
    <animate attributeName="r" values="90;92;90" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner decorative ring with rotation -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#lsgGold)" stroke-width="2" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;-360 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Super Giant silhouette with subtle movement -->
  <path d="M 100 50 L 140 70 L 150 100 L 140 130 L 100 150 L 60 130 L 50 100 L 60 70 Z" 
        fill="url(#lsgGold)">
    <animateTransform attributeName="transform" type="scale" values="1;1.02;1" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Head detail with pulse -->
  <circle cx="100" cy="75" r="15" fill="#9C2A2C">
    <animate attributeName="r" values="15;16;15" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Shoulder pads with alternating pulse -->
  <path d="M 60 70 L 75 85 L 70 95 L 60 90 Z" fill="#9C2A2C">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 140 70 L 125 85 L 130 95 L 140 90 Z" fill="#9C2A2C">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <!-- LSG Text -->
  <text x="100" y="175" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" 
        fill="url(#lsgGold)" text-anchor="middle">
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
    LSG
  </text>
</svg>

