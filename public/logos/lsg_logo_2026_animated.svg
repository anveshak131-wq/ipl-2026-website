<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lsg-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C2A2C;stop-opacity:1">
        <animate attributeName="stop-color" values="#9C2A2C;#AC3A3C;#9C2A2C" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#7C1A1C;stop-opacity:1">
        <animate attributeName="stop-color" values="#7C1A1C;#9C2A2C;#7C1A1C" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="lsg-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7E17D;stop-opacity:1">
        <animate attributeName="stop-color" values="#F7E17D;#FFF78D;#F7E17D" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#D7C15D;stop-opacity:1">
        <animate attributeName="stop-color" values="#D7C15D;#F7E17D;#D7C15D" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="lsg-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur">
        <animate attributeName="stdDeviation" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield -->
  <path d="M 100 20 L 155 40 L 165 100 L 155 160 L 100 180 L 45 160 L 35 100 L 45 40 Z" 
        fill="url(#lsg-red)" 
        stroke="url(#lsg-yellow)" 
        stroke-width="3" 
        filter="url(#lsg-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- LSG Text -->
  <text x="100" y="110" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" 
        text-anchor="middle" fill="url(#lsg-yellow)" filter="url(#lsg-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="3s" repeatCount="indefinite"/>
    LSG
  </text>
</svg>
