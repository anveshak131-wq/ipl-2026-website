<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gujarat Giants WPL - Orange & Gold Lioness -->
  <defs>
    <linearGradient id="gg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield Background -->
  <path d="M100 10 L170 40 L170 110 Q170 150 100 190 Q30 150 30 110 L30 40 Z" 
        fill="url(#gg-grad)" stroke="url(#gg-gold)" stroke-width="3"/>
  
  <!-- GG Letters -->
  <text x="100" y="95" font-family="Arial Black, sans-serif" font-size="56" 
        font-weight="bold" fill="url(#gg-gold)" text-anchor="middle" 
        dominant-baseline="middle">GG</text>
  
  <!-- Subtitle -->
  <text x="100" y="135" font-family="Arial, sans-serif" font-size="14" 
        font-weight="bold" fill="#FFD700" text-anchor="middle">WOMEN</text>
  
  <!-- Lioness Crown -->
  <path d="M70 45 L85 50 L100 40 L115 50 L130 45" 
        stroke="#FFD700" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="75" cy="47" r="4" fill="#FFD700"/>
  <circle cx="100" cy="42" r="4" fill="#FFD700"/>
  <circle cx="125" cy="47" r="4" fill="#FFD700"/>
  
  <!-- Paw Prints -->
  <circle cx="65" cy="160" r="3" fill="#FFD700"/>
  <circle cx="75" cy="160" r="3" fill="#FFD700"/>
  <circle cx="70" cy="167" r="4" fill="#FFD700"/>
  
  <circle cx="125" cy="160" r="3" fill="#FFD700"/>
  <circle cx="135" cy="160" r="3" fill="#FFD700"/>
  <circle cx="130" cy="167" r="4" fill="#FFD700"/>
</svg>
