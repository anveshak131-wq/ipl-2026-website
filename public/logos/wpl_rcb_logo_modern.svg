<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wpl-rcb-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF1E3C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E91E2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8102E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wpl-rcb-pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:1" />
    </linearGradient>
    <filter id="wpl-rcb-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .logo-pulse { animation: pulse 3s ease-in-out infinite; }
      .logo-rotate { animation: rotate 20s linear infinite; transform-origin: 100px 100px; }
    </style>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#wpl-rcb-red-grad)" class="logo-pulse" filter="url(#wpl-rcb-glow)"/>
  
  <!-- Inner Shield with Pink Accent -->
  <path d="M 100 30 L 150 50 L 150 120 L 100 170 L 50 120 L 50 50 Z" fill="url(#wpl-rcb-pink-grad)" opacity="0.9"/>
  
  <!-- RCB Text -->
  <text x="100" y="110" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="#FFF" text-anchor="middle" opacity="0.95">RCB</text>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="5" fill="#FF69B4" class="logo-rotate">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>

