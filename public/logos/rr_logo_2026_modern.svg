<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rr-royal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1D4ED8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F296D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#081642;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rr-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <filter id="rr-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes crown {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-5px) scale(1.05); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
      }
      .crown { animation: crown 2.5s ease-in-out infinite; }
      .logo-pulse { animation: pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#rr-royal-grad)" stroke="#F59E0B" stroke-width="4" class="logo-pulse" filter="url(#rr-glow)"/>
  
  <!-- Crown -->
  <g class="crown">
    <path d="M 70 100 L 85 70 L 100 85 L 115 70 L 130 100 L 100 120 Z" fill="url(#rr-gold-grad)" opacity="0.95"/>
    <circle cx="85" cy="75" r="4" fill="#FFFFFF"/>
    <circle cx="100" cy="80" r="4" fill="#38BDF8"/>
    <circle cx="115" cy="75" r="4" fill="#FFFFFF"/>
  </g>
  
  <!-- RR Text -->
  <text x="100" y="152" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#FBBF24" text-anchor="middle" opacity="0.98">RR</text>
</svg>

