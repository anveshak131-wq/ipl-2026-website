<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="srh-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF822A;stop-opacity:1">
        <animate attributeName="stop-color" values="#FF822A;#FF9A4A;#FF822A" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#E66A1A;stop-opacity:1">
        <animate attributeName="stop-color" values="#E66A1A;#FF822A;#E66A1A" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="srh-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1"/>
    </linearGradient>
    <filter id="srh-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur">
        <animate attributeName="stdDeviation" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Circle with sun rays -->
  <circle cx="100" cy="100" r="80" fill="url(#srh-orange)" stroke="url(#srh-black)" stroke-width="3" filter="url(#srh-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Sun rays -->
  <g stroke="url(#srh-orange)" stroke-width="3" opacity="0.7">
    <line x1="100" y1="20" x2="100" y2="30">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="170" x2="100" y2="180">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    <line x1="20" y1="100" x2="30" y2="100">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="1s"/>
    </line>
    <line x1="170" y1="100" x2="180" y2="100">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </line>
  </g>
  
  <!-- SRH Text -->
  <text x="100" y="110" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" 
        text-anchor="middle" fill="url(#srh-black)" filter="url(#srh-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="3s" repeatCount="indefinite"/>
    SRH
  </text>
</svg>
