<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="srhGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF822A;stop-opacity:1">
        <animate attributeName="stop-color" values="#FF822A;#FFA500;#FF822A" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFA500;#FF822A;#FFA500" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="srhSun" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFD700;#FFA500;#FFD700" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF822A;stop-opacity:1"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#srhGradient)" stroke="#000" stroke-width="4">
    <animate attributeName="r" values="90;92;90" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Sun rays with rotation -->
  <g fill="url(#srhSun)" opacity="0.8">
    <rect x="95" y="20" width="10" height="25" rx="5">
      <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="95" y="155" width="10" height="25" rx="5">
      <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="95" width="25" height="10" rx="5">
      <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="155" y="95" width="25" height="10" rx="5">
      <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="40" width="8" height="20" rx="4" transform="rotate(-45 44 50)">
      <animateTransform attributeName="transform" type="rotate" values="-45 100 100;315 100 100" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="152" y="40" width="8" height="20" rx="4" transform="rotate(45 156 50)">
      <animateTransform attributeName="transform" type="rotate" values="45 100 100;405 100 100" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="140" width="8" height="20" rx="4" transform="rotate(45 44 150)">
      <animateTransform attributeName="transform" type="rotate" values="45 100 100;405 100 100" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="152" y="140" width="8" height="20" rx="4" transform="rotate(-45 156 150)">
      <animateTransform attributeName="transform" type="rotate" values="-45 100 100;315 100 100" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Central sun with pulse -->
  <circle cx="100" cy="100" r="45" fill="url(#srhSun)">
    <animate attributeName="r" values="45;48;45" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="35" fill="#FF822A">
    <animate attributeName="r" values="35;37;35" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- SRH Text -->
  <text x="100" y="110" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" 
        fill="#000" text-anchor="middle">
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
    SRH
  </text>
</svg>

