<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kkr-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B2CBF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9D4EDD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A189A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="kkr-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <filter id="kkr-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
      }
      .float { animation: float 3s ease-in-out infinite; }
      .logo-pulse { animation: pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#kkr-purple-grad)" class="logo-pulse" filter="url(#kkr-glow)"/>
  
  <!-- Knight Helmet -->
  <g class="float">
    <path d="M 100 50 L 130 70 L 130 100 L 100 120 L 70 100 L 70 70 Z" fill="url(#kkr-gold-grad)" opacity="0.9"/>
    <circle cx="100" cy="85" r="15" fill="#7B2CBF"/>
    <path d="M 100 70 L 110 80 L 100 90 L 90 80 Z" fill="url(#kkr-gold-grad)"/>
  </g>
  
  <!-- KKR Text -->
  <text x="100" y="150" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#FFD700" text-anchor="middle" opacity="0.95">KKR</text>
</svg>

