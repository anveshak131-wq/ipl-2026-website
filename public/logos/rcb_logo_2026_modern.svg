<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rcb-red-premium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC1C24;stop-opacity:1">
        <animate attributeName="stop-color" values="#EC1C24;#FF2A35;#EC1C24" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#C8102E;stop-opacity:1">
        <animate attributeName="stop-color" values="#C8102E;#E91E2A;#C8102E" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#8B1A1A;stop-opacity:1">
        <animate attributeName="stop-color" values="#8B1A1A;#C8102E;#8B1A1A" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="rcb-gold-premium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFD700;#FFF700;#FFD700" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFA500;#FFD700;#FFA500" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1">
        <animate attributeName="stop-color" values="#D4AF37;#FFD700;#D4AF37" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="rcb-glow-premium">
      <feGaussianBlur stdDeviation="4" result="coloredBlur">
        <animate attributeName="stdDeviation" values="4;6;4" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="rcb-inner-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes roar { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.08) translateY(-3px); } }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.02); } }
      @keyframes glow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      .lion-roar { animation: roar 4s ease-in-out infinite; transform-origin: 100px 85px; }
      .logo-pulse { animation: pulse 3s ease-in-out infinite; }
      .glow-effect { animation: glow 2s ease-in-out infinite; }
    </style>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#rcb-red-premium)" opacity="0.3" class="glow-effect" filter="url(#rcb-glow-premium)"/>
  <circle cx="100" cy="100" r="88" fill="url(#rcb-red-premium)" class="logo-pulse" filter="url(#rcb-glow-premium)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#rcb-gold-premium)" stroke-width="2" opacity="0.4"/>
  <path d="M 100 25 L 145 50 L 145 115 L 100 175 L 55 115 L 55 50 Z" fill="url(#rcb-gold-premium)" opacity="0.95" filter="url(#rcb-inner-glow)"/>
  <path d="M 100 35 L 135 55 L 135 110 L 100 165 L 65 110 L 65 55 Z" fill="url(#rcb-red-premium)" opacity="0.8"/>
  <g class="lion-roar">
    <ellipse cx="100" cy="75" rx="42" ry="35" fill="url(#rcb-gold-premium)" opacity="0.95" filter="url(#rcb-inner-glow)"/>
    <ellipse cx="100" cy="75" rx="38" ry="32" fill="#B8860B" opacity="0.7"/>
    <ellipse cx="100" cy="85" rx="32" ry="28" fill="url(#rcb-gold-premium)" opacity="0.95"/>
    <circle cx="92" cy="80" r="5" fill="#000" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="108" cy="80" r="5" fill="#000" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="92" cy="80" r="2.5" fill="#FFF"/>
    <circle cx="108" cy="80" r="2.5" fill="#FFF"/>
    <ellipse cx="100" cy="88" rx="4" ry="3" fill="#000" opacity="0.8"/>
    <path d="M 95 92 Q 100 96 105 92" stroke="#000" stroke-width="2" fill="none" opacity="0.8"/>
    <line x1="75" y1="85" x2="85" y2="87" stroke="url(#rcb-gold-premium)" stroke-width="1.5" opacity="0.7"/>
    <line x1="75" y1="90" x2="85" y2="90" stroke="url(#rcb-gold-premium)" stroke-width="1.5" opacity="0.7"/>
    <line x1="75" y1="95" x2="85" y2="93" stroke="url(#rcb-gold-premium)" stroke-width="1.5" opacity="0.7"/>
    <line x1="115" y1="87" x2="125" y2="85" stroke="url(#rcb-gold-premium)" stroke-width="1.5" opacity="0.7"/>
    <line x1="115" y1="90" x2="125" y2="90" stroke="url(#rcb-gold-premium)" stroke-width="1.5" opacity="0.7"/>
    <line x1="115" y1="93" x2="125" y2="95" stroke="url(#rcb-gold-premium)" stroke-width="1.5" opacity="0.7"/>
  </g>
  <text x="100" y="140" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="url(#rcb-gold-premium)" text-anchor="middle" opacity="0.98" filter="url(#rcb-inner-glow)" style="letter-spacing: 2px;">RCB</text>
  <g opacity="0.6">
    <path d="M 100 20 L 102 25 L 107 25 L 103 28 L 105 33 L 100 30 L 95 33 L 97 28 L 93 25 L 98 25 Z" fill="url(#rcb-gold-premium)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 50 L 61 53 L 64 53 L 62 55 L 63 58 L 60 56 L 57 58 L 58 55 L 56 53 L 59 53 Z" fill="url(#rcb-gold-premium)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 50 L 141 53 L 144 53 L 142 55 L 143 58 L 140 56 L 137 58 L 138 55 L 136 53 L 139 53 Z" fill="url(#rcb-gold-premium)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
