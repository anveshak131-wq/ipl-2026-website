<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rcb-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC1C24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8102E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B1A1A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rcb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes roar {
        0%, 100% { transform: scale(1) translateY(0); }
        50% { transform: scale(1.1) translateY(-4px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.03); }
      }
      @keyframes glow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .lion { animation: roar 3s ease-in-out infinite; transform-origin: 100px 85px; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .glow { animation: glow 2s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Outer Glow -->
  <circle cx="100" cy="100" r="92" fill="url(#rcb-red)" opacity="0.4" class="glow" filter="url(#glow)"/>
  
  <!-- Main Circle -->
  <circle cx="100" cy="100" r="88" fill="url(#rcb-red)" class="pulse" filter="url(#glow)"/>
  
  <!-- Gold Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#rcb-gold)" stroke-width="3" opacity="0.6"/>
  
  <!-- Shield Base -->
  <path d="M 100 30 L 145 55 L 145 120 L 100 170 L 55 120 L 55 55 Z" fill="url(#rcb-gold)" opacity="0.95" filter="url(#glow)"/>
  
  <!-- Inner Shield -->
  <path d="M 100 40 L 135 60 L 135 115 L 100 160 L 65 115 L 65 60 Z" fill="url(#rcb-red)" opacity="0.85"/>
  
  <!-- Lion Head -->
  <g class="lion">
    <!-- Mane -->
    <ellipse cx="100" cy="75" rx="40" ry="32" fill="url(#rcb-gold)" opacity="0.95"/>
    <ellipse cx="100" cy="75" rx="36" ry="29" fill="#D4AF37" opacity="0.6"/>
    
    <!-- Face -->
    <ellipse cx="100" cy="85" rx="30" ry="26" fill="url(#rcb-gold)"/>
    
    <!-- Eyes -->
    <circle cx="92" cy="80" r="5" fill="#000"/>
    <circle cx="108" cy="80" r="5" fill="#000"/>
    <circle cx="92" cy="80" r="2" fill="#FFF"/>
    <circle cx="108" cy="80" r="2" fill="#FFF"/>
    
    <!-- Nose -->
    <ellipse cx="100" cy="88" rx="3.5" ry="2.5" fill="#000"/>
    
    <!-- Mouth -->
    <path d="M 95 92 Q 100 95 105 92" stroke="#000" stroke-width="2" fill="none"/>
    
    <!-- Whiskers -->
    <line x1="70" y1="85" x2="85" y2="87" stroke="url(#rcb-gold)" stroke-width="2" opacity="0.8"/>
    <line x1="70" y1="90" x2="85" y2="90" stroke="url(#rcb-gold)" stroke-width="2" opacity="0.8"/>
    <line x1="70" y1="95" x2="85" y2="93" stroke="url(#rcb-gold)" stroke-width="2" opacity="0.8"/>
    <line x1="115" y1="87" x2="130" y2="85" stroke="url(#rcb-gold)" stroke-width="2" opacity="0.8"/>
    <line x1="115" y1="90" x2="130" y2="90" stroke="url(#rcb-gold)" stroke-width="2" opacity="0.8"/>
    <line x1="115" y1="93" x2="130" y2="95" stroke="url(#rcb-gold)" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- RCB Text -->
  <text x="100" y="140" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" fill="url(#rcb-gold)" text-anchor="middle" opacity="0.98" style="letter-spacing: 3px;" filter="url(#glow)">RCB</text>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="25" r="3" fill="url(#rcb-gold)" opacity="0.8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="2.5" fill="url(#rcb-gold)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="60" r="2.5" fill="url(#rcb-gold)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
