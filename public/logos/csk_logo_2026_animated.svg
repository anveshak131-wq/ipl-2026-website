<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFF00;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFFF00;#FFD700;#FFFF00" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFD700;#FFFF00;#FFD700" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="cskGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFFF00;stop-opacity:0.5">
        <animate attributeName="stop-opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FFFF00;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background with pulse -->
  <circle cx="100" cy="100" r="90" fill="url(#cskGradient)" stroke="#000" stroke-width="4">
    <animate attributeName="r" values="90;93;90" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#000" stroke-width="2" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;-360 100 100" dur="15s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Lion head silhouette with subtle movement -->
  <path d="M 100 50 Q 70 60 60 90 Q 55 100 60 110 Q 70 120 100 115 Q 130 120 140 110 Q 145 100 140 90 Q 130 60 100 50 Z" 
        fill="#000">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,2;0,0" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Lion mane with wave effect -->
  <path d="M 100 50 Q 85 45 70 50 Q 60 55 55 65 Q 50 75 55 85 Q 60 95 70 100 Q 85 105 100 100 Q 115 105 130 100 Q 140 95 145 85 Q 150 75 145 65 Q 140 55 130 50 Q 115 45 100 50 Z" 
        fill="#000" opacity="0.6">
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- CSK Text -->
  <text x="100" y="165" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" 
        fill="#000" text-anchor="middle">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    CSK
  </text>
  
  <!-- Decorative stars with twinkle -->
  <path d="M 50 50 L 52 58 L 60 58 L 54 63 L 56 71 L 50 66 L 44 71 L 46 63 L 40 58 L 48 58 Z" 
        fill="#000" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 150 50 L 152 58 L 160 58 L 154 63 L 156 71 L 150 66 L 144 71 L 146 63 L 140 58 L 148 58 Z" 
        fill="#000" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
  </path>
</svg>

