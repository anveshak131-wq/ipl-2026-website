<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="csk-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFF00;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFFF00;#FFF700;#FFFF00" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFD700;#FFFF00;#FFD700" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="csk-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004BA0;stop-opacity:1">
        <animate attributeName="stop-color" values="#004BA0;#0056C3;#004BA0" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1">
        <animate attributeName="stop-color" values="#003366;#004BA0;#003366" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="csk-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur">
        <animate attributeName="stdDeviation" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Circle -->
  <circle cx="100" cy="100" r="85" fill="url(#csk-yellow)" stroke="url(#csk-blue)" stroke-width="4" filter="url(#csk-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- CSK Text -->
  <text x="100" y="110" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
        text-anchor="middle" fill="url(#csk-blue)" filter="url(#csk-glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="3s" repeatCount="indefinite"/>
    CSK
  </text>
  
  <!-- Lion silhouette -->
  <path d="M 100 70 Q 85 60 70 70 Q 75 80 80 90 Q 85 100 100 105 Q 115 100 120 90 Q 125 80 130 70 Q 115 60 100 70" 
        fill="url(#csk-blue)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
