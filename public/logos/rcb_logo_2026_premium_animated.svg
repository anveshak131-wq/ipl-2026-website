<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium RCB Red Gradient with pulse -->
    <linearGradient id="rcb-red-premium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC1C24;stop-opacity:1">
        <animate attributeName="stop-color" values="#EC1C24;#FF1F2A;#EC1C24" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#C8102E;stop-opacity:1">
        <animate attributeName="stop-color" values="#C8102E;#E91E2A;#C8102E" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#8B1A1A;stop-opacity:1">
        <animate attributeName="stop-color" values="#8B1A1A;#C8102E;#8B1A1A" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Premium Gold Gradient with shimmer -->
    <linearGradient id="rcb-gold-premium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFD700;#FFF700;#FFD700" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1">
        <animate attributeName="stop-color" values="#D4AF37;#FFD700;#D4AF37" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1">
        <animate attributeName="stop-color" values="#B8860B;#D4AF37;#B8860B" dur="2.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Enhanced glow filter -->
    <filter id="glow-premium">
      <feGaussianBlur stdDeviation="4" result="coloredBlur">
        <animate attributeName="stdDeviation" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shimmer effect -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0">
        <animate attributeName="offset" values="-100%;200%" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.6">
        <animate attributeName="offset" values="-50%;250%" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0">
        <animate attributeName="offset" values="0%;300%" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Particle effect -->
    <radialGradient id="particle">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#rcb-gold-premium)" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="95;98;95" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Shield with premium styling -->
  <path d="M 100 20 L 155 40 L 165 100 L 155 160 L 100 180 L 45 160 L 35 100 L 45 40 Z" 
        fill="url(#rcb-red-premium)" 
        stroke="url(#rcb-gold-premium)" 
        stroke-width="4" 
        filter="url(#glow-premium)">
    <animateTransform attributeName="transform" type="scale" values="1;1.02;1" dur="4s" repeatCount="indefinite" additive="sum"/>
    <animateTransform attributeName="transform" type="rotate" values="0;1;0" dur="8s" repeatCount="indefinite" additive="sum"/>
  </path>
  
  <!-- Shimmer overlay -->
  <path d="M 100 20 L 155 40 L 165 100 L 155 160 L 100 180 L 45 160 L 35 100 L 45 40 Z" 
        fill="url(#shimmer)" 
        opacity="0.4"/>
  
  <!-- Inner border with pulse -->
  <path d="M 100 35 L 140 50 L 145 100 L 140 150 L 100 165 L 60 150 L 55 100 L 60 50 Z" 
        fill="none" 
        stroke="url(#rcb-gold-premium)" 
        stroke-width="2.5" 
        opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Crown with enhanced animation -->
  <g filter="url(#glow-premium)">
    <path d="M 100 30 L 110 45 L 125 40 L 115 55 L 130 65 L 100 55 L 70 65 L 85 55 L 75 40 L 90 45 Z" 
          fill="url(#rcb-gold-premium)">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Crown jewels -->
    <circle cx="100" cy="40" r="3" fill="#FFD700">
      <animate attributeName="r" values="3;4;3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="50" r="2" fill="#FFD700">
      <animate attributeName="r" values="2;3;2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="50" r="2" fill="#FFD700">
      <animate attributeName="r" values="2;3;2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- RCB Text with premium styling -->
  <text x="100" y="120" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
        text-anchor="middle" fill="url(#rcb-gold-premium)" filter="url(#glow-premium)">
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="3s" repeatCount="indefinite"/>
    RCB
  </text>
  
  <!-- Decorative elements -->
  <g opacity="0.6">
    <circle cx="50" cy="80" r="2" fill="url(#rcb-gold-premium)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;5,5;0,0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80" r="2" fill="url(#rcb-gold-premium)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-5,5;0,0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="120" r="2" fill="url(#rcb-gold-premium)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;5,-5;0,0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="120" r="2" fill="url(#rcb-gold-premium)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-5,-5;0,0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Bottom accent -->
  <path d="M 70 160 Q 100 170 130 160" 
        fill="none" 
        stroke="url(#rcb-gold-premium)" 
        stroke-width="2" 
        opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </path>
</svg>

