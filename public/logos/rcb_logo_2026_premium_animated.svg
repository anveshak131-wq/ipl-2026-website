<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium RCB Red Gradient -->
    <linearGradient id="rcb-red-premium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC1C24;stop-opacity:1">
        <animate attributeName="stop-color" values="#EC1C24;#FF2A35;#EC1C24" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#C8102E;stop-opacity:1">
        <animate attributeName="stop-color" values="#C8102E;#E91E2A;#C8102E" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#8B1A1A;stop-opacity:1">
        <animate attributeName="stop-color" values="#8B1A1A;#C8102E;#8B1A1A" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Premium Gold Gradient -->
    <linearGradient id="rcb-gold-premium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFD700;#FFF700;#FFD700" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1">
        <animate attributeName="stop-color" values="#D4AF37;#FFD700;#D4AF37" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Subtle glow filter -->
    <filter id="glow-premium">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur">
        <animate attributeName="stdDeviation" values="2.5;4;2.5" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shimmer effect -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0">
        <animate attributeName="offset" values="-100%;200%" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.3">
        <animate attributeName="offset" values="-50%;250%" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0">
        <animate attributeName="offset" values="0%;300%" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  
  <!-- Background circle with subtle pulse -->
  <circle cx="100" cy="100" r="90" fill="url(#rcb-red-premium)" opacity="0.15">
    <animate attributeName="r" values="90;92;90" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main shield shape - clean and modern -->
  <path d="M 100 25 L 150 45 L 160 100 L 150 155 L 100 175 L 50 155 L 40 100 L 50 45 Z" 
        fill="url(#rcb-red-premium)" 
        stroke="url(#rcb-gold-premium)" 
        stroke-width="3.5" 
        filter="url(#glow-premium)">
    <animateTransform attributeName="transform" type="scale" values="1;1.01;1" dur="5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Shimmer overlay - subtle -->
  <path d="M 100 25 L 150 45 L 160 100 L 150 155 L 100 175 L 50 155 L 40 100 L 50 45 Z" 
        fill="url(#shimmer)" 
        opacity="0.25"/>
  
  <!-- Inner decorative border -->
  <path d="M 100 40 L 135 55 L 140 100 L 135 145 L 100 160 L 65 145 L 60 100 L 65 55 Z" 
        fill="none" 
        stroke="url(#rcb-gold-premium)" 
        stroke-width="2" 
        opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Crown icon - simplified and elegant -->
  <g filter="url(#glow-premium)">
    <path d="M 100 50 L 108 62 L 120 58 L 112 72 L 125 80 L 100 70 L 75 80 L 88 72 L 80 58 L 92 62 Z" 
          fill="url(#rcb-gold-premium)">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Crown center jewel -->
    <circle cx="100" cy="60" r="2.5" fill="#FFD700">
      <animate attributeName="r" values="2.5;3;2.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- RCB Text - bold and clean -->
  <text x="100" y="125" font-family="Arial Black, sans-serif" font-size="38" font-weight="900" 
        text-anchor="middle" fill="url(#rcb-gold-premium)" filter="url(#glow-premium)" letter-spacing="2">
    <animateTransform attributeName="transform" type="scale" values="1;1.02;1" dur="4s" repeatCount="indefinite"/>
    RCB
  </text>
  
  <!-- Subtle accent dots -->
  <g opacity="0.5">
    <circle cx="70" cy="85" r="1.5" fill="url(#rcb-gold-premium)">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="85" r="1.5" fill="url(#rcb-gold-premium)">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite" begin="1.25s"/>
    </circle>
    <circle cx="70" cy="115" r="1.5" fill="url(#rcb-gold-premium)">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="130" cy="115" r="1.5" fill="url(#rcb-gold-premium)">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite" begin="1.85s"/>
    </circle>
  </g>
  
  <!-- Bottom accent line -->
  <path d="M 75 155 Q 100 162 125 155" 
        fill="none" 
        stroke="url(#rcb-gold-premium)" 
        stroke-width="2" 
        opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
