<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- RCB WPL - Red & Gold Lion Shield -->
  <defs>
    <linearGradient id="rcb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8102E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rcb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield Background -->
  <path d="M100 10 L170 40 L170 110 Q170 150 100 190 Q30 150 30 110 L30 40 Z" 
        fill="url(#rcb-grad)" stroke="url(#rcb-gold)" stroke-width="3"/>
  
  <!-- RCB Letters -->
  <text x="100" y="85" font-family="Arial Black, sans-serif" font-size="48" 
        font-weight="bold" fill="url(#rcb-gold)" text-anchor="middle" 
        dominant-baseline="middle">RCB</text>
  
  <!-- Subtitle -->
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="14" 
        font-weight="bold" fill="#FFD700" text-anchor="middle">WOMEN</text>
  
  <!-- Lion Crown -->
  <path d="M85 145 L100 135 L115 145 M90 145 L100 138 L110 145" 
        stroke="#FFD700" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Stars -->
  <polygon points="70,50 72,56 78,56 73,60 75,66 70,62 65,66 67,60 62,56 68,56" fill="#FFD700"/>
  <polygon points="130,50 132,56 138,56 133,60 135,66 130,62 125,66 127,60 122,56 128,56" fill="#FFD700"/>
</svg>
