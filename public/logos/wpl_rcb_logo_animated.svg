<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Red to Dark Red Gradient -->
    <linearGradient id="rcb-red-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E">
        <animate attributeName="stop-color" values="#C8102E;#E91E63;#C8102E" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#A01D1D" />
      <stop offset="100%" stop-color="#8B1A1A">
        <animate attributeName="stop-color" values="#8B1A1A;#A01D1D;#8B1A1A" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="rcb-gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>
    
    <!-- Pink Accent Gradient -->
    <linearGradient id="rcb-pink-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E91E63" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    
    <!-- Radial Glow -->
    <radialGradient id="rcb-glow-gradient" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#C8102E" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#C8102E" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C8102E" stop-opacity="0" />
    </radialGradient>
    
    <!-- Shadow Filter -->
    <filter id="rcb-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="5" dy="5" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Glow Filter -->
    <filter id="rcb-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Animated Background Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#rcb-glow-gradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#rcb-red-gradient)" stroke-width="6" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 200 200;360 200 200" dur="18s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main Logo Group -->
  <g transform="translate(200,200)" filter="url(#rcb-shadow)">
    <!-- Crown/Shield Base -->
    <path d="M-75,-50 Q0,-70 75,-50 L70,50 Q0,70 -70,50 Z" fill="url(#rcb-red-gradient)" filter="url(#rcb-glow)" opacity="0.95">
      <animate attributeName="opacity" values="0.95;1;0.95" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Crown Top -->
    <path d="M-60,-50 L-40,-70 L0,-80 L40,-70 L60,-50" fill="url(#rcb-gold-gradient)" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    
    <!-- Female Symbol (Venus) - Detailed -->
    <g transform="translate(0,-15)">
      <!-- Outer Circle -->
      <circle cx="0" cy="0" r="35" fill="none" stroke="url(#rcb-gold-gradient)" stroke-width="4" opacity="0.95">
        <animate attributeName="r" values="35;37;35" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Inner Circle Glow -->
      <circle cx="0" cy="0" r="30" fill="url(#rcb-pink-gradient)" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Cross Symbol -->
      <g>
        <!-- Vertical Line -->
        <line x1="0" y1="-45" x2="0" y2="15" stroke="url(#rcb-gold-gradient)" stroke-width="5" stroke-linecap="round" opacity="0.95">
          <animate attributeName="stroke-width" values="5;6;5" dur="2s" repeatCount="indefinite"/>
        </line>
        <!-- Horizontal Line -->
        <line x1="-20" y1="0" x2="20" y2="0" stroke="url(#rcb-gold-gradient)" stroke-width="5" stroke-linecap="round" opacity="0.95">
          <animate attributeName="stroke-width" values="5;6;5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
        </line>
      </g>
      
      <!-- Decorative Dots -->
      <circle cx="0" cy="-30" r="3" fill="url(#rcb-gold-gradient)" opacity="0.8">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- RCB Text -->
    <text x="0" y="70" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="bold" font-family="Arial, sans-serif" opacity="0.95" filter="url(#rcb-glow)">
      <tspan x="0" dy="0">RCB</tspan>
    </text>
    
    <!-- Decorative Flames -->
    <g transform="translate(-50,60)">
      <path d="M0,0 Q-8,-15 0,-25 Q8,-15 0,0" fill="url(#rcb-gold-gradient)" opacity="0.85">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="1.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="1.5s" repeatCount="indefinite" additive="sum"/>
      </path>
      <path d="M0,0 Q-6,-12 0,-20 Q6,-12 0,0" fill="url(#rcb-pink-gradient)" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.9;0.7" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="1.5s" begin="0.2s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>
    <g transform="translate(50,60)">
      <path d="M0,0 Q-8,-15 0,-25 Q8,-15 0,0" fill="url(#rcb-gold-gradient)" opacity="0.85">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="1.5s" begin="0.3s" repeatCount="indefinite" additive="sum"/>
      </path>
      <path d="M0,0 Q-6,-12 0,-20 Q6,-12 0,0" fill="url(#rcb-pink-gradient)" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.9;0.7" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="1.5s" begin="0.5s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>
    
    <!-- Sparkles -->
    <circle cx="-100" cy="-80" r="4" fill="url(#rcb-gold-gradient)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="-80" r="4" fill="url(#rcb-gold-gradient)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-110" r="4" fill="url(#rcb-pink-gradient)" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
