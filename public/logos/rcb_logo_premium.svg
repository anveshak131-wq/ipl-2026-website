<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Red to Dark Red Gradient -->
    <linearGradient id="rcb-red-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC1C24">
        <animate attributeName="stop-color" values="#EC1C24;#FF4757;#EC1C24" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#C41E3A" />
      <stop offset="100%" stop-color="#8B0000">
        <animate attributeName="stop-color" values="#8B0000;#B91C1C;#8B0000" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="rcb-gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>
    
    <!-- Radial Glow -->
    <radialGradient id="rcb-glow-gradient" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#EC1C24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#EC1C24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EC1C24" stop-opacity="0" />
    </radialGradient>
    
    <!-- Shadow Filter -->
    <filter id="rcb-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="5" dy="5" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Glow Filter -->
    <filter id="rcb-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Inner Glow -->
    <filter id="rcb-inner-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="200" r="190" fill="url(#rcb-glow-gradient)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Main Shield Background -->
  <g filter="url(#rcb-shadow)">
    <path d="M200 30 L320 80 L320 200 C320 280 280 320 200 360 C120 320 80 280 80 200 L80 80 Z" 
          fill="url(#rcb-red-gradient)" opacity="0.98" />
    
    <!-- Inner Shield Border -->
    <path d="M200 40 L310 85 L310 200 C310 275 275 310 200 350 C125 310 90 275 90 200 L90 85 Z" 
          fill="none" stroke="#FFD700" stroke-width="4" opacity="0.95" />
    
    <!-- Inner Highlight -->
    <path d="M200 50 L300 90 L300 200 C300 270 270 300 200 340 C130 300 100 270 100 200 L100 90 Z" 
          fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  </g>
  
  <!-- Decorative Corner Elements -->
  <g stroke="#FFD700" stroke-width="3" fill="none" opacity="0.7">
    <!-- Top Left Corner -->
    <path d="M100 50 L120 50 L100 70" />
    <path d="M90 60 L110 60 L90 80" />
    <!-- Top Right Corner -->
    <path d="M300 50 L280 50 L300 70" />
    <path d="M310 60 L290 60 L310 80" />
    <!-- Bottom Left Corner -->
    <path d="M100 350 L120 350 L100 330" />
    <path d="M90 340 L110 340 L90 320" />
    <!-- Bottom Right Corner -->
    <path d="M300 350 L280 350 L300 330" />
    <path d="M310 340 L290 340 L310 320" />
  </g>
  
  <!-- Crown at Top -->
  <g transform="translate(200, 70)">
    <animateTransform attributeName="transform" type="translate" values="200,70; 200,67; 200,70" dur="3s" repeatCount="indefinite" />
    <path d="M-60 -20 L-50 -8 L-35 -16 L-22 -8 L0 -20 L22 -8 L35 -16 L50 -8 L60 -20 L0 -28 Z" 
          fill="url(#rcb-gold-gradient)" stroke="#000000" stroke-width="3" filter="url(#rcb-glow)" />
    <!-- Crown Base -->
    <rect x="-60" y="-20" width="120" height="8" fill="url(#rcb-gold-gradient)" opacity="0.9" />
    <!-- Crown Jewels -->
    <circle cx="-35" cy="-24" r="5" fill="#EC1C24">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="-24" r="5" fill="#EC1C24">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="0.3s" />
      <animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="2s" repeatCount="indefinite" begin="0.3s" />
    </circle>
    <circle cx="35" cy="-24" r="5" fill="#EC1C24">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="0.6s" />
      <animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="2s" repeatCount="indefinite" begin="0.6s" />
    </circle>
  </g>
  
  <!-- Lion Head - Detailed Front View -->
  <g transform="translate(200, 200)">
    <animateTransform attributeName="transform" type="translate" values="200,200; 200,197; 200,200" dur="4s" repeatCount="indefinite" />
    
    <!-- Majestic Mane - Layered and Detailed -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 0 0; 2 0 0; -2 0 0" dur="6s" repeatCount="indefinite" />
      
      <!-- Outer Mane Layer -->
      <circle cx="0" cy="-10" r="80" fill="url(#rcb-gold-gradient)" opacity="0.95" filter="url(#rcb-glow)" />
      <circle cx="0" cy="-10" r="75" fill="none" stroke="#FF8C00" stroke-width="3" opacity="0.8" />
      
      <!-- Middle Mane Layer -->
      <circle cx="0" cy="-10" r="70" fill="url(#rcb-gold-gradient)" opacity="0.85" />
      
      <!-- Mane Texture - Detailed Lines -->
      <g stroke="#FF8C00" stroke-width="2.5" opacity="0.7" fill="none">
        <!-- Left Side Texture -->
        <path d="M-70 -20 Q-60 -40 -50 -30" />
        <path d="M-60 -30 Q-50 -50 -40 -40" />
        <path d="M-50 -40 Q-40 -60 -30 -50" />
        <path d="M-40 -50 Q-30 -70 -20 -60" />
        <path d="M-30 -60 Q-20 -80 -10 -70" />
        <!-- Right Side Texture -->
        <path d="M70 -20 Q60 -40 50 -30" />
        <path d="M60 -30 Q50 -50 40 -40" />
        <path d="M50 -40 Q40 -60 30 -50" />
        <path d="M40 -50 Q30 -70 20 -60" />
        <path d="M30 -60 Q20 -80 10 -70" />
        <!-- Top Texture -->
        <path d="M-20 -70 Q-10 -85 0 -90 Q10 -85 20 -70" />
      </g>
      
      <!-- Inner Mane Highlight -->
      <circle cx="0" cy="-10" r="65" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6" />
    </g>
    
    <!-- Lion Face - Detailed and Fierce -->
    <g>
      <!-- Face Base -->
      <ellipse cx="0" cy="5" rx="55" ry="60" fill="#1a1a1a" opacity="0.98" filter="url(#rcb-shadow)" />
      
      <!-- Face Highlight -->
      <ellipse cx="5" cy="0" rx="48" ry="53" fill="#2a2a2a" opacity="0.5" />
      
      <!-- Cheek Highlights -->
      <ellipse cx="-25" cy="15" rx="12" ry="15" fill="#3a3a3a" opacity="0.4" />
      <ellipse cx="25" cy="15" rx="12" ry="15" fill="#3a3a3a" opacity="0.4" />
      
      <!-- Fierce Eyes -->
      <!-- Left Eye -->
      <ellipse cx="-22" cy="-5" rx="11" ry="13" fill="#FFFFFF" opacity="0.95">
        <animate attributeName="ry" values="13;1.3;13" dur="0.3s" repeatCount="indefinite" begin="0s;5s" />
      </ellipse>
      <circle cx="-22" cy="-5" r="7" fill="#EC1C24">
        <animate attributeName="r" values="7;8.5;7" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0.75;1" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="-22" cy="-5" r="3" fill="#000000" />
      <!-- Eye Glow -->
      <circle cx="-22" cy="-5" r="11" fill="#EC1C24" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2.5s" repeatCount="indefinite" />
      </circle>
      
      <!-- Right Eye -->
      <ellipse cx="22" cy="-5" rx="11" ry="13" fill="#FFFFFF" opacity="0.95">
        <animate attributeName="ry" values="13;1.3;13" dur="0.3s" repeatCount="indefinite" begin="0s;5s" />
      </ellipse>
      <circle cx="22" cy="-5" r="7" fill="#EC1C24">
        <animate attributeName="r" values="7;8.5;7" dur="2.5s" repeatCount="indefinite" begin="0.15s" />
        <animate attributeName="opacity" values="1;0.75;1" dur="2.5s" repeatCount="indefinite" begin="0.15s" />
      </circle>
      <circle cx="22" cy="-5" r="3" fill="#000000" />
      <!-- Eye Glow -->
      <circle cx="22" cy="-5" r="11" fill="#EC1C24" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2.5s" repeatCount="indefinite" begin="0.15s" />
      </circle>
      
      <!-- Eyebrows - Fierce -->
      <path d="M-35 -15 Q-22 -18 -22 -12" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      <path d="M35 -15 Q22 -18 22 -12" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      
      <!-- Nose - Detailed -->
      <ellipse cx="0" cy="18" rx="8" ry="6" fill="#000000" opacity="0.9" />
      <path d="M-6 18 Q0 25 6 18" fill="none" stroke="#FFD700" stroke-width="3.5" stroke-linecap="round">
        <animate attributeName="stroke-width" values="3.5;4;3.5" dur="2s" repeatCount="indefinite" />
      </path>
      <ellipse cx="0" cy="18" rx="4" ry="3" fill="#1a1a1a" opacity="0.8" />
      
      <!-- Roaring Mouth -->
      <path d="M-30 30 Q0 42 30 30 Q25 55 0 48 Q-25 55 -30 30 Z" 
            fill="#EC1C24" opacity="0.95" filter="url(#rcb-shadow)" />
      <path d="M-25 35 Q0 45 25 35" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round" />
      
      <!-- Teeth - Sharp -->
      <path d="M-8 35 L-5 48 L-11 48 Z" fill="#FFFFFF" opacity="0.95" />
      <path d="M8 35 L5 48 L11 48 Z" fill="#FFFFFF" opacity="0.95" />
      
      <!-- Whiskers - Detailed -->
      <g stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <line x1="-40" y1="8" x2="-55" y2="5" />
        <line x1="-40" y1="13" x2="-55" y2="13" />
        <line x1="-40" y1="18" x2="-55" y2="21" />
        <line x1="-40" y1="23" x2="-55" y2="26" />
        <line x1="40" y1="8" x2="55" y2="5" />
        <line x1="40" y1="13" x2="55" y2="13" />
        <line x1="40" y1="18" x2="55" y2="21" />
        <line x1="40" y1="23" x2="55" y2="26" />
      </g>
    </g>
  </g>
  
  <!-- RCB Text - Bold with Effects -->
  <g transform="translate(200, 340)">
    <!-- Text Shadow -->
    <text x="0" y="0" font-size="44" font-weight="900" fill="#000000" text-anchor="middle" 
          font-family="Arial Black, sans-serif" letter-spacing="8" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="2,2; 2,2" dur="0.1s" />
      RCB
    </text>
    <!-- Main Text -->
    <text x="0" y="0" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" 
          font-family="Arial Black, sans-serif" letter-spacing="8" filter="url(#rcb-shadow)">
      <animate attributeName="opacity" values="0.95;1;0.95" dur="2s" repeatCount="indefinite" />
      RCB
    </text>
    <!-- Text Outline -->
    <text x="0" y="0" font-size="44" font-weight="900" fill="none" stroke="#FFD700" stroke-width="2" 
          text-anchor="middle" font-family="Arial Black, sans-serif" letter-spacing="8" opacity="0.9">RCB</text>
  </g>
  
  <!-- Energy Particles -->
  <circle cx="340" cy="200" r="4" fill="#FFD700" opacity="0.6">
    <animate attributeName="r" values="2;7;2" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="90" r="4" fill="#EC1C24" opacity="0.6">
    <animate attributeName="r" values="2;7;2" dur="2.8s" repeatCount="indefinite" begin="0.3s" />
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite" begin="0.3s" />
  </circle>
  <circle cx="60" cy="200" r="4" fill="#FFD700" opacity="0.6">
    <animate attributeName="r" values="2;7;2" dur="3.1s" repeatCount="indefinite" begin="0.6s" />
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.1s" repeatCount="indefinite" begin="0.6s" />
  </circle>
  <circle cx="200" cy="310" r="4" fill="#EC1C24" opacity="0.6">
    <animate attributeName="r" values="2;7;2" dur="2.7s" repeatCount="indefinite" begin="0.9s" />
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.7s" repeatCount="indefinite" begin="0.9s" />
  </circle>
</svg>
