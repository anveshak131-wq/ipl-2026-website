<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078BC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099DD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dcRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF1B26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#dcGradient)" stroke="url(#dcRed)" stroke-width="4"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#dcRed)" stroke-width="2" opacity="0.5"/>
  
  <!-- Capital building silhouette -->
  <path d="M 60 140 L 60 100 L 70 90 L 70 80 L 80 70 L 80 100 L 90 90 L 100 80 L 110 90 L 120 100 L 120 70 L 130 80 L 130 90 L 140 100 L 140 140 Z" 
        fill="url(#dcRed)"/>
  
  <!-- Dome -->
  <path d="M 100 80 Q 70 80 70 100 Q 70 120 100 120 Q 130 120 130 100 Q 130 80 100 80" 
        fill="url(#dcRed)"/>
  
  <!-- DC Text -->
  <text x="100" y="170" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle">DC</text>
</svg>

