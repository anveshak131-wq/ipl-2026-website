<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="srh-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF822A" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <radialGradient id="srh-sun" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FF822A" />
      <stop offset="100%" stop-color="#FF6B00" />
    </radialGradient>
    <filter id="srh-glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#000000"/>
  
  <!-- Sun Circle -->
  <circle cx="200" cy="200" r="150" fill="url(#srh-sun)" filter="url(#srh-glow)"/>
  
  <!-- Sun Rays -->
  <g transform="translate(200, 200)">
    <g opacity="0.9">
      <rect x="-3" y="-160" width="6" height="30" fill="url(#srh-orange)" transform="rotate(0)"/>
      <rect x="-3" y="-160" width="6" height="30" fill="url(#srh-orange)" transform="rotate(30)"/>
      <rect x="-3" y="-160" width="6" height="30" fill="url(#srh-orange)" transform="rotate(60)"/>
      <rect x="-3" y="-160" width="6" height="30" fill="url(#srh-orange)" transform="rotate(90)"/>
      <rect x="-3" y="-160" width="6" height="30" fill="url(#srh-orange)" transform="rotate(120)"/>
      <rect x="-3" y="-160" width="6" height="30" fill="url(#srh-orange)" transform="rotate(150)"/>
      <rect x="-3" y="-160" width="6" height="30" fill="url(#srh-orange)" transform="rotate(180)"/>
      <rect x="-3" y="-160" width="6" height="30" fill="url(#srh-orange)" transform="rotate(210)"/>
      <rect x="-3" y="-160" width="6" height="30" fill="url(#srh-orange)" transform="rotate(240)"/>
      <rect x="-3" y="-160" width="6" height="30" fill="url(#srh-orange)" transform="rotate(270)"/>
      <rect x="-3" y="-160" width="6" height="30" fill="url(#srh-orange)" transform="rotate(300)"/>
      <rect x="-3" y="-160" width="6" height="30" fill="url(#srh-orange)" transform="rotate(330)"/>
    </g>
  </g>
  
  <!-- Inner Circle -->
  <circle cx="200" cy="200" r="100" fill="#000000"/>
  
  <!-- SRH Text -->
  <text x="200" y="220" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" 
        fill="url(#srh-orange)" text-anchor="middle" letter-spacing="3">SRH</text>
</svg>
