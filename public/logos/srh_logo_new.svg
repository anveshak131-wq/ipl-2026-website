<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="srh-sun-grad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="40%" stop-color="#FF822A" />
      <stop offset="100%" stop-color="#FF6B00" />
    </radialGradient>
    <linearGradient id="srh-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF822A" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <filter id="srh-glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Black Background -->
  <rect width="400" height="400" fill="#000000"/>
  
  <!-- Sun with Rays -->
  <g transform="translate(200, 200)">
    <!-- Rays -->
    <g opacity="0.85">
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(0)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(15)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(30)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(45)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(60)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(75)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(90)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(105)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(120)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(135)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(150)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(165)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(180)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(195)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(210)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(225)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(240)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(255)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(270)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(285)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(300)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(315)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(330)"/>
      <rect x="-2" y="-170" width="4" height="35" fill="url(#srh-orange-grad)" transform="rotate(345)"/>
    </g>
    
    <!-- Main Sun Circle -->
    <circle cx="0" cy="0" r="110" fill="url(#srh-sun-grad)" filter="url(#srh-glow)"/>
    
    <!-- Inner Circle -->
    <circle cx="0" cy="0" r="90" fill="#000000"/>
    
    <!-- SRH Text -->
    <text x="0" y="15" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" 
          fill="url(#srh-orange-grad)" text-anchor="middle" letter-spacing="4">SRH</text>
  </g>
</svg>
