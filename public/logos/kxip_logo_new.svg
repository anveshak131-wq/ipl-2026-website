<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pbks-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED1D24" />
      <stop offset="100%" stop-color="#C8102E" />
    </linearGradient>
    <linearGradient id="pbks-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBDD0B" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <radialGradient id="pbks-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ED1D24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ED1D24" stop-opacity="0" />
    </radialGradient>
    <filter id="pbks-shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#pbks-glow)"/>
  
  <!-- Main Circle -->
  <circle cx="200" cy="200" r="170" fill="url(#pbks-red-grad)" filter="url(#pbks-shadow)"/>
  
  <!-- Inner Border -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#pbks-gold-grad)" stroke-width="5"/>
  
  <!-- Crown Design -->
  <g transform="translate(200, 160)">
    <!-- Crown Base -->
    <path d="M -55 -5 L -35 -30 L -15 -40 L 15 -40 L 35 -30 L 55 -5 L 50 5 L -50 5 Z" 
          fill="url(#pbks-gold-grad)"/>
    <!-- Crown Points -->
    <rect x="-50" y="-40" width="14" height="35" fill="url(#pbks-gold-grad)"/>
    <rect x="-20" y="-40" width="14" height="40" fill="url(#pbks-gold-grad)"/>
    <rect x="6" y="-40" width="14" height="40" fill="url(#pbks-gold-grad)"/>
    <rect x="36" y="-40" width="14" height="35" fill="url(#pbks-gold-grad)"/>
    <!-- Crown Gems -->
    <circle cx="-20" cy="-25" r="5" fill="#ED1D24"/>
    <circle cx="20" cy="-25" r="5" fill="#ED1D24"/>
  </g>
  
  <!-- PBKS Text -->
  <text x="200" y="270" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" 
        fill="url(#pbks-gold-grad)" text-anchor="middle" letter-spacing="3">PBKS</text>
  
  <!-- Decorative Dots -->
  <circle cx="140" cy="140" r="5" fill="url(#pbks-gold-grad)" opacity="0.8"/>
  <circle cx="260" cy="140" r="5" fill="url(#pbks-gold-grad)" opacity="0.8"/>
  <circle cx="140" cy="260" r="5" fill="url(#pbks-gold-grad)" opacity="0.8"/>
  <circle cx="260" cy="260" r="5" fill="url(#pbks-gold-grad)" opacity="0.8"/>
</svg>
