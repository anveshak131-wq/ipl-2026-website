<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="mTitle">
  <title id="mTitle">SportsUP18 Mascot</title>
  <defs>
    <linearGradient id="mascotGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#0B7A3F"/>
      <stop offset="100%" stop-color="#0FA67A"/>
    </linearGradient>
    <filter id="mascotShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00121a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="28" fill="#071022" />

  <!-- Helmet -->
  <g transform="translate(60,28)" filter="url(#mascotShadow)">
    <ellipse cx="100" cy="70" rx="80" ry="56" fill="url(#mascotGrad)" stroke="#052927" stroke-width="4" />
    <rect x="20" y="80" width="160" height="32" rx="16" fill="#0b3b2b" />

    <!-- visor -->
    <path d="M38 68 C72 34, 128 34, 162 68" fill="#071022" opacity="0.28" />

    <!-- faceplate lines -->
    <path d="M52 100 L84 100" stroke="#F3F4F6" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <path d="M116 100 L148 100" stroke="#F3F4F6" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Bat on shoulder -->
  <g transform="translate(180,150) rotate(-24 30 10)">
    <rect x="0" y="0" width="130" height="22" rx="10" fill="#E6D5C6" stroke="#C7A17A" stroke-width="1.3" />
    <rect x="6" y="12" width="24" height="6" rx="3" fill="#C7A17A" />
  </g>

  <!-- Ball with stitching -->
  <g transform="translate(240,116)">
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" stroke="#E63946" stroke-width="3" />
    <path d="M-6 -8 Q-2 0 -6 8" stroke="#C12A3A" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <path d="M6 -8 Q2 0 6 8" stroke="#C12A3A" stroke-width="1.6" fill="none" stroke-linecap="round" />
  </g>

  <!-- Wordmark: sports + up + 18 -->
  <g transform="translate(28,248)">
    <text x="0" y="0" font-family="Bebas Neue, Arial" font-size="28" fill="#F8FAFC">SPORTS</text>
    <text x="132" y="0" font-family="Bebas Neue, Arial" font-size="28" fill="#0FA67A">UP</text>
    <text x="188" y="0" font-family="Bebas Neue, Arial" font-size="28" fill="#E63946">18</text>
  </g>
</svg>
