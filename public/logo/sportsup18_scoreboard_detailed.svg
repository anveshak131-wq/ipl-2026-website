<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="420" height="140" role="img" aria-labelledby="sb">
  <title id="sb">SportsUP18 Scoreboard Detailed</title>
  <defs>
    <linearGradient id="sbBg" x1="0" x2="1">
      <stop offset="0%" stop-color="#07102a" />
      <stop offset="100%" stop-color="#071a3a" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" rx="12" fill="#071022" />

  <g transform="translate(12,12)">
    <rect x="0" y="0" width="260" height="116" rx="10" fill="url(#sbBg)" stroke="#0b3b2b" stroke-width="2" />

    <text x="18" y="40" font-family="Inter, Arial" font-size="18" fill="#9EECD9">SPORTS</text>
    <text x="18" y="70" font-family="Inter, Arial" font-size="34" font-weight="700" fill="#F8FAFC">UP</text>

    <!-- small badge with 18 -->
    <g transform="translate(180,18)">
      <rect x="0" y="0" width="80" height="80" rx="8" fill="#0b1f3a" stroke="#0FA67A" stroke-width="2" />
      <text x="40" y="52" font-family="Bebas Neue, Arial" font-size="36" fill="#E63946" text-anchor="middle">18</text>
    </g>

    <!-- subtle scoreboard ticks -->
    <g transform="translate(270,18)" fill="#9CCBB8">
      <rect x="0" y="0" width="120" height="8" rx="4" />
      <rect x="0" y="20" width="120" height="8" rx="4" />
    </g>
  </g>
</svg>
