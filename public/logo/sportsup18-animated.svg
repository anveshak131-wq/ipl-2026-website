<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aTitle">
  <title id="aTitle">SportsUP18 Animated Logo</title>
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#0B7A3F"/>
      <stop offset="100%" stop-color="#0FA67A"/>
    </linearGradient>

    <mask id="revealMask">
      <rect x="0" y="0" width="400" height="120" fill="#fff"/>
      <rect id="maskRect" x="0" y="0" width="0" height="120" fill="#000" />
    </mask>

    <path id="arcPath" d="M30 90 C150 10, 250 10, 370 90" />
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="transparent"/>

  <!-- moving ball along arc -->
  <g>
    <circle id="ball" r="10" fill="#E63946" stroke="#C12A3A" stroke-width="2">
      <animateMotion dur="1.1s" begin="0s" fill="freeze" keySplines="0.42 0 0.58 1" calcMode="spline">
        <mpath xlink:href="#arcPath" />
      </animateMotion>
    </circle>
  </g>

  <!-- wordmark revealed by mask -->
  <g mask="url(#revealMask)">
    <text x="20" y="80" font-family="'Bebas Neue',Arial,Helvetica,sans-serif" font-size="48" fill="url(#g1)">Sports</text>
    <text x="260" y="80" font-family="'Bebas Neue',Arial,Helvetica,sans-serif" font-size="48" fill="#111827">UP</text>
    <text x="320" y="80" font-family="'Bebas Neue',Arial,Helvetica,sans-serif" font-size="48" fill="#E63946">18</text>
  </g>

  <!-- mask reveal animation (CSS fallback controlled via JS or CSS) -->
  <style>
    @keyframes reveal {
      from { width: 0; }
      to { width: 400px; }
    }
    #maskRect { animation: reveal 1.2s ease-out forwards; }

    @media (prefers-reduced-motion: reduce) {
      #ball, #maskRect { animation: none; }
      #maskRect { width: 400px; }
    }
  </style>
</svg>