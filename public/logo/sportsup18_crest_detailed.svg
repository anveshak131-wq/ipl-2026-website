<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420" role="img" aria-labelledby="cdTitle">
  <title id="cdTitle">SportsUP18 Detailed Crest</title>
  <defs>
    <linearGradient id="crestDetGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#062f24" />
      <stop offset="100%" stop-color="#0FA67A" />
    </linearGradient>
    <filter id="crestShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00121a" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="32" fill="#071022" />

  <g transform="translate(30,24)" filter="url(#crestShadow)">
    <path d="M150 6 C210 34, 270 96, 270 164 C270 242, 210 302, 150 330 C90 302, 30 242, 30 164 C30 96, 90 34, 150 6 Z" fill="url(#crestDetGrad)" stroke="#031b17" stroke-width="4" />

    <!-- inner patterned band -->
    <path d="M150 32 C190 54, 238 92, 238 152 C238 210, 192 250, 150 270 C108 250, 62 210, 62 152 C62 92, 110 54, 150 32 Z" fill="none" stroke="#0b4f3a" stroke-width="2" opacity="0.18" />

    <!-- laurel halves -->
    <g transform="translate(24,88)" fill="#F8FAFC" opacity="0.9">
      <path d="M8 28 C18 18, 34 12, 44 6" stroke="#F8FAFC" stroke-width="3" fill="none" />
      <path d="M12 40 C26 32, 46 30, 62 28" stroke="#F8FAFC" stroke-width="3" fill="none" />
    </g>

    <g transform="translate(216,88) scale(-1,1)" fill="#F8FAFC" opacity="0.9">
      <path d="M8 28 C18 18, 34 12, 44 6" stroke="#F8FAFC" stroke-width="3" fill="none" />
      <path d="M12 40 C26 32, 46 30, 62 28" stroke="#F8FAFC" stroke-width="3" fill="none" />
    </g>

    <!-- Bat crossing -->
    <g transform="translate(70,170) rotate(-28 100 20)">
      <rect x="0" y="0" width="180" height="22" rx="10" fill="#E6D5C6" stroke="#C7A17A" stroke-width="1.3" />
    </g>

    <!-- Stumps centered -->
    <g transform="translate(140,158)" fill="#F8FAFC">
      <rect x="0" y="0" width="6" height="56" rx="1" />
      <rect x="12" y="0" width="6" height="56" rx="1" />
      <rect x="24" y="0" width="6" height="56" rx="1" />
    </g>

    <!-- Ball foreground -->
    <circle cx="210" cy="150" r="14" fill="#FFFFFF" stroke="#E63946" stroke-width="3" />
    <path d="M204 142 Q210 150 204 158" stroke="#C12A3A" stroke-width="1.6" fill="none" />
  </g>

  <!-- Ribbon and wordmark -->
  <g transform="translate(40,340)">
    <rect x="20" y="0" width="300" height="56" rx="12" fill="#091727" opacity="0.95" />
    <text x="180" y="38" font-family="Bebas Neue, Arial" font-size="28" fill="#F8FAFC" text-anchor="middle">SPORTSUP 18</text>
  </g>
</svg>
