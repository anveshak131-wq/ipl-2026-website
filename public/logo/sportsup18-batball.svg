<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title>SportsUP18 — Bat & Ball Monogram</title>
  <rect width="100%" height="100%" fill="none"/>
  <g transform="translate(40,30)">
    <!-- Bat (stylized) -->
    <g fill="#D1B000" stroke="#B68B00" stroke-width="2">
      <rect x="0" y="40" width="20" height="110" rx="6" transform="rotate(-20 10 95)"/>
      <rect x="-6" y="20" width="10" height="30" rx="3" transform="rotate(-20 -1 35)"/>
    </g>

    <!-- Ball as part of 18 -->
    <g transform="translate(170,60)">
      <circle cx="30" cy="40" r="18" fill="#E63946" stroke="#C12A3A" stroke-width="2"/>
      <path d="M18 40 q6 -6 12 0" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Wordmark -->
    <g transform="translate(60,10)">
      <text x="0" y="80" font-family="'Bebas Neue',Arial,Helvetica,sans-serif" font-size="72" fill="#0B7A3F">Sports</text>
      <text x="310" y="80" font-family="'Bebas Neue',Arial,Helvetica,sans-serif" font-size="72" fill="#111827">UP</text>
      <text x="380" y="80" font-family="'Bebas Neue',Arial,Helvetica,sans-serif" font-size="72" fill="#E63946">18</text>
    </g>
  </g>
</svg>