<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="title">
  <title id="title">SportsUP18 Monogram</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#0B7A3F" />
      <stop offset="100%" stop-color="#0FA67A" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" rx="20" fill="#071022" />

  <!-- Bat (stylized) -->
  <g transform="translate(18,20) rotate(-20 30 30)">
    <rect x="22" y="8" width="56" height="12" rx="6" fill="#E6D5C6" stroke="#C7A17A" stroke-width="1"/>
    <rect x="16" y="20" width="16" height="4" rx="2" fill="#C7A17A"/>
  </g>

  <!-- Ball arc -->
  <path d="M18 72 C38 34, 82 34, 102 72" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <circle cx="100" cy="70" r="7" fill="#E63946" stroke="#C12A3A" stroke-width="1.2"/>

  <!-- Small 'S' shaped negative-space suggest — drawn as path for a compact look -->
  <text x="14" y="104" font-family="Bebas Neue, Arial, Helvetica, sans-serif" font-size="20" fill="#F3F4F6">S18</text>
</svg>
