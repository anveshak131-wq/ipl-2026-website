<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favicon-gradient-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#d97706" />
    </linearGradient>

    <linearGradient id="favicon-gradient-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="100%" stopColor="#3b82f6" />
    </linearGradient>

    <linearGradient id="favicon-gradient-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#a78bfa" />
      <stop offset="100%" stopColor="#8b5cf6" />
    </linearGradient>

    <style>
      @keyframes spin-slow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes float-up {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .favicon-spin {
        animation: spin-slow 20s linear infinite;
        transform-origin: 50px 50px;
      }
      .favicon-pulse {
        animation: pulse-glow 2s ease-in-out infinite;
      }
      .favicon-float {
        animation: float-up 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="#030712" />

  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#favicon-gradient-1)" opacity="0.1" class="favicon-pulse" />

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#favicon-gradient-1)" strokeWidth="2" opacity="0.8" />

  <!-- Inner decorative circle -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#favicon-gradient-2)" strokeWidth="1.5" opacity="0.6" />

  <!-- Cricket bat shape (stylized) -->
  <g class="favicon-float">
    <!-- Bat handle -->
    <rect x="45" y="35" width="10" height="30" rx="5" fill="url(#favicon-gradient-1)" opacity="0.9" />

    <!-- Bat blade -->
    <ellipse cx="50" cy="28" rx="12" ry="8" fill="url(#favicon-gradient-1)" opacity="0.95" />
  </g>

  <!-- Cricket ball (stylized) -->
  <g class="favicon-spin">
    <circle cx="50" cy="65" r="8" fill="url(#favicon-gradient-2)" opacity="0.9" />
    <!-- Ball seam -->
    <path d="M 42 65 Q 50 70 58 65" stroke="url(#favicon-gradient-3)" strokeWidth="1.5" fill="none" opacity="0.8" />
  </g>

  <!-- Upward arrow (dynamic element) -->
  <g class="favicon-float" style="animation-delay: 0.5s">
    <path d="M 65 55 L 70 50 L 75 55" stroke="url(#favicon-gradient-3)" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" opacity="0.8" />
    <line x1="70" y1="50" x2="70" y2="60" stroke="url(#favicon-gradient-3)" strokeWidth="2" opacity="0.8" strokeLinecap="round" />
  </g>

  <!-- Number 18 indicator (subtle) -->
  <circle cx="75" cy="30" r="6" fill="url(#favicon-gradient-3)" opacity="0.7" />
  <text x="75" y="33" textAnchor="middle" fontSize="8" fontWeight="bold" fill="white" opacity="0.9">18</text>
</svg>
