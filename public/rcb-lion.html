<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RCB Logo Preview</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(200, 16, 46, 0.42), transparent 35%),
        linear-gradient(180deg, #13070b 0%, #050304 100%);
      color: #f6c65b;
      font-family: Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .frame {
      width: min(92vw, 520px);
      padding: 28px;
      border-radius: 28px;
      border: 1px solid rgba(246, 198, 91, 0.24);
      background: rgba(255, 255, 255, 0.03);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 22px 40px rgba(200, 16, 46, 0.4));
    }

    p {
      margin: 18px 0 0;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(246, 198, 91, 0.88);
    }
  </style>
</head>
<body>
  <div class="frame">
    <img src="/logos/rcb_logo_official.png" alt="Royal Challengers Bengaluru logo" />
    <p>Official RCB crest preview</p>
  </div>
</body>
</html>
